<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bac à sable FFT</title>
<style>
/* ---------------------------------------------------------------------------
   Atelier — shared stylesheet for the course web tools.

   Themes: light / dark / auto. `data-theme` on <html> wins; with no attribute the
   OS preference decides. Every colour pair below is checked for WCAG AA contrast
   (4.5:1 body text, 3:1 large text and UI borders).

   Sizes are in rem so the text-size control scales the whole interface.
   --------------------------------------------------------------------------- */

:root {
  --ui-scale: 1;

  --bg:        #eef0f4;
  --panel:     #ffffff;
  --sunken:    #f6f7f9;
  --ink:       #12161c;   /* 16.9:1 on --panel */
  --ink-soft:  #4d5764;   /*  7.6:1 on --panel */
  --line:      #c8cdd6;
  --line-firm: #9aa3b1;
  --accent:    #14549e;   /*  7.1:1 on --panel */
  --accent-ink:#ffffff;
  --accent-bg: #e4ecf7;
  --ok:        #12664a;   /*  6.4:1 */
  --warn:      #7a5200;   /*  6.2:1 */
  --bad:       #a41f1a;   /*  6.6:1 */
  --focus:     #14549e;

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0e1116;
    --panel:     #171b22;
    --sunken:    #10141a;
    --ink:       #e8ecf2;   /* 13.8:1 on --panel */
    --ink-soft:  #a3adbb;   /*  6.9:1 on --panel */
    --line:      #2b323d;
    --line-firm: #4a545f;
    --accent:    #7fb4ff;   /*  7.6:1 on --panel */
    --accent-ink:#0e1116;
    --accent-bg: #1b2634;
    --ok:        #6cc79c;
    --warn:      #e0b354;
    --bad:       #ff9086;
    --focus:     #7fb4ff;
  }
}

:root[data-theme="dark"] {
  --bg:        #0e1116;
  --panel:     #171b22;
  --sunken:    #10141a;
  --ink:       #e8ecf2;
  --ink-soft:  #a3adbb;
  --line:      #2b323d;
  --line-firm: #4a545f;
  --accent:    #7fb4ff;
  --accent-ink:#0e1116;
  --accent-bg: #1b2634;
  --ok:        #6cc79c;
  --warn:      #e0b354;
  --bad:       #ff9086;
  --focus:     #7fb4ff;
}

/* Respect a user asking the OS for more contrast. */
@media (prefers-contrast: more) {
  :root { --line: var(--line-firm); --ink-soft: var(--ink); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

* { box-sizing: border-box; }

html { font-size: calc(100% * var(--ui-scale)); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  /* Column layout so the console sits on the bottom edge even when the page is
     shorter than the window; `position: sticky` alone only pins it once there is
     something to scroll. */
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main { flex: 1 0 auto; }

/* Visible focus for every interactive element, keyboard or not. */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

.at-skip {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 10px 16px;
  z-index: 100;
  border-radius: 0 0 var(--radius) 0;
}
.at-skip:focus { left: 0; }

.at-visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

/* --- header --------------------------------------------------------------- */

.at-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
  padding: 0.6rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.at-home {
  flex: none;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
  padding: 0.4rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.at-home:hover { background: var(--accent-bg); }

.at-titles { flex: 1 1 14rem; min-width: 0; }
.at-titles h1 { margin: 0; font-size: 1.05rem; font-weight: 650; line-height: 1.3; }
.at-titles p  { margin: 0; font-size: 0.8rem; color: var(--ink-soft); line-height: 1.35; }

.at-tools { flex: none; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

.at-seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.at-seg button {
  border: 0;
  border-radius: 0;
  padding: 0.35rem 0.6rem;
  font-size: 0.78rem;
  background: transparent;
  color: var(--ink-soft);
  min-width: 2.4rem;
}
.at-seg button + button { border-left: 1px solid var(--line); }
.at-seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 650;
}
.at-seg button:hover:not([aria-pressed="true"]) { background: var(--accent-bg); color: var(--ink); }

/* --- layout --------------------------------------------------------------- */

main { width: 100%; max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }

.at-lede { font-size: 1.02rem; color: var(--ink-soft); margin: 0 0 1.5rem; max-width: 68ch; }
.at-lede strong { color: var(--ink); }

section.at-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  margin: 0 0 1.35rem;
}
section.at-panel > h2 { margin: 0 0 0.25rem; font-size: 1rem; line-height: 1.35; }
section.at-panel > .at-hint {
  margin: 0 0 0.85rem; font-size: 0.88rem; color: var(--ink-soft); max-width: 70ch;
}

/* --- controls ------------------------------------------------------------- */

.at-controls { display: flex; flex-wrap: wrap; gap: 0.7rem 0.9rem; align-items: flex-end;
               margin-bottom: 0.9rem; }
.at-field { display: flex; flex-direction: column; gap: 0.25rem; }
.at-field > label, .at-fieldset > legend {
  font-size: 0.75rem; color: var(--ink-soft); text-transform: uppercase;
  letter-spacing: 0.05em; font-weight: 600;
}

button, select, input[type="number"], input[type="text"] {
  font: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--sunken);
  border: 1px solid var(--line-firm);
  border-radius: var(--radius);
  padding: 0.45rem 0.7rem;
  min-height: 2.25rem;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.at-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.at-primary:hover:not(:disabled) { filter: brightness(1.12); color: var(--accent-ink); }

.at-fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 0.6rem 0.8rem; }
.at-checks { display: grid; gap: 0.2rem 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.at-check { display: flex; align-items: baseline; gap: 0.45rem; font-size: 0.88rem; }
.at-check input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); flex: none; }
.at-check code { font: 0.82rem var(--mono); color: var(--ink-soft); }

/* --- drop zone ------------------------------------------------------------ */

.at-drop {
  display: block;
  width: 100%;
  border: 2px dashed var(--line-firm);
  border-radius: var(--radius);
  padding: 1.35rem;
  text-align: center;
  color: var(--ink-soft);
  background: var(--sunken);
  font-size: 0.92rem;
  transition: background 0.15s, border-color 0.15s;
}
.at-drop:hover { border-color: var(--accent); color: var(--ink); }
.at-drop.at-over { border-color: var(--accent); background: var(--accent-bg); color: var(--ink); }
.at-drop small { display: block; margin-top: 0.3rem; font-size: 0.8rem; }

/* --- canvases ------------------------------------------------------------- */

.at-canvas-wrap { overflow-x: auto; margin: 0 0 0.4rem; }

/* The stack is created by Atelier.transport when a canvas gets a playhead: the
   overlay must scroll with the canvas, so it is positioned against a box the same
   width as the canvas rather than against the scrolling wrapper. */
.at-canvas-stack { position: relative; width: 100%; min-width: 32rem; }
.at-playhead {
  position: absolute;
  width: 2px;
  background: var(--bad);
  pointer-events: none;
  display: none;
  z-index: 2;
}
canvas.at-scrubbable { cursor: ew-resize; touch-action: none; }

/* --- transport ------------------------------------------------------------ */

.at-transport {
  display: flex; align-items: center; gap: 0.5rem 0.7rem; flex-wrap: wrap;
  margin: 0.6rem 0 0.7rem;
}
.at-transport input[type="range"] {
  flex: 1 1 12rem; min-width: 7rem; accent-color: var(--accent);
}
.at-transport button { min-width: 5.5rem; }
.at-time { font: 0.82rem var(--mono); color: var(--ink-soft); white-space: nowrap; }
canvas.at-canvas {
  display: block;
  width: 100%;
  min-width: 32rem;
  height: auto;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.at-caption { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.35rem; }

/* --- tables --------------------------------------------------------------- */

.at-table-wrap { overflow: auto; max-height: 22rem; border: 1px solid var(--line); border-radius: 4px; }
table.at-table { border-collapse: collapse; width: 100%; font: 0.82rem var(--mono); }
table.at-table caption { text-align: left; padding: 0.4rem 0.6rem; color: var(--ink-soft);
                         font: 0.8rem var(--sans); }
table.at-table th, table.at-table td { padding: 0.3rem 0.65rem; text-align: right; white-space: nowrap; }
table.at-table th { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line-firm); }
table.at-table th button {
  all: unset; cursor: pointer; font: inherit; font-weight: 650; color: var(--ink);
  padding: 0.15rem 0.2rem;
}
table.at-table th button:hover { color: var(--accent); text-decoration: underline; }
table.at-table th:first-child, table.at-table td:first-child { text-align: left; }
table.at-table tbody tr:nth-child(even) { background: var(--sunken); }

/* --- status / progress ---------------------------------------------------- */

.at-status { font-size: 0.87rem; color: var(--ink-soft); min-height: 1.5em; margin: 0.5rem 0 0; }
.at-status.ok  { color: var(--ok); }
.at-status.bad { color: var(--bad); }
.at-status::before { font-weight: 700; margin-right: 0.4rem; }
.at-status.ok::before  { content: "OK"; }
.at-status.bad::before { content: "!"; }

progress { width: 100%; height: 0.5rem; accent-color: var(--accent); }
progress[hidden] { display: none; }

/* --- console -------------------------------------------------------------- */

.at-console {
  position: sticky;
  bottom: 0;
  z-index: 15;
  background: var(--panel);
  border-top: 1px solid var(--line-firm);
}
.at-console-bar {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.35rem 1.25rem;
}
.at-console-bar h2 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
                     color: var(--ink-soft); font-weight: 650; }
.at-console-count { font: 0.78rem var(--mono); color: var(--ink-soft); }
.at-console-count.bad { color: var(--bad); font-weight: 700; }
.at-console-bar .at-spacer { flex: 1; }
.at-console-bar button { padding: 0.25rem 0.55rem; font-size: 0.78rem; min-height: 0; }

.at-console-body {
  max-height: 13rem;
  overflow-y: auto;
  margin: 0;
  padding: 0.5rem 1.25rem 0.8rem;
  border-top: 1px solid var(--line);
  background: var(--sunken);
  font: 0.82rem/1.5 var(--mono);
  list-style: none;
}
.at-console-body[hidden] { display: none; }
.at-console-body li { display: flex; gap: 0.6rem; padding: 0.08rem 0; }
.at-console-body .at-time { color: var(--ink-soft); flex: none; }
.at-console-body .at-lvl { flex: none; font-weight: 700; min-width: 3.6rem; }
.at-console-body .at-lvl.info { color: var(--ink-soft); }
.at-console-body .at-lvl.ok   { color: var(--ok); }
.at-console-body .at-lvl.warn { color: var(--warn); }
.at-console-body .at-lvl.err  { color: var(--bad); }
.at-console-body .at-msg { white-space: pre-wrap; word-break: break-word; }

/* --- homepage cards ------------------------------------------------------- */

.at-grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
a.at-card {
  display: block; padding: 1rem 1.1rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: inherit;
}
a.at-card:hover { border-color: var(--accent); background: var(--accent-bg); }
a.at-card h3 { margin: 0 0 0.25rem; font-size: 0.98rem; color: var(--accent); }
a.at-card p  { margin: 0; font-size: 0.87rem; color: var(--ink-soft); }
.at-card[aria-disabled="true"] { opacity: 0.6; }
.at-tag {
  display: inline-block; font: 0.72rem var(--mono); text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--ink-soft);
  border: 1px solid var(--line-firm); border-radius: 3px;
  padding: 0.05rem 0.4rem; margin-bottom: 0.5rem;
}

/* --- accessible mode ------------------------------------------------------
   Opt-in, via the toggle in the header (data-a11y="on" on <html>). The baseline
   theme is already AA-contrast, keyboard-operable and motion-safe; this goes
   further — near-maximum contrast, bigger type, more space, underlined links,
   larger hit targets — for anyone who wants it, without imposing it on everyone.
   -------------------------------------------------------------------------- */

:root[data-a11y="on"] {
  --ui-scale: 1.15;
  --bg:        #ffffff;
  --panel:     #ffffff;
  --sunken:    #eef1f5;
  --ink:       #000000;   /* 21:1 */
  --ink-soft:  #1f2530;   /* 15.3:1 — no low-contrast greys in this mode */
  --line:      #5c6673;
  --line-firm: #2b323d;
  --accent:    #0a3d7a;   /* 10.5:1 */
  --accent-ink:#ffffff;
  --accent-bg: #dce7f5;
  --ok:        #04513a;
  --warn:      #5c3d00;
  --bad:       #8a1410;
  --focus:     #0a3d7a;
}

@media (prefers-color-scheme: dark) {
  :root[data-a11y="on"]:not([data-theme="light"]) {
    --bg:        #000000;
    --panel:     #0b0e13;
    --sunken:    #141922;
    --ink:       #ffffff;
    --ink-soft:  #dfe5ee;
    --line:      #7d8794;
    --line-firm: #aeb7c4;
    --accent:    #9ec8ff;   /* 11.4:1 on --panel */
    --accent-ink:#000000;
    --accent-bg: #16233a;
    --ok:        #8fe0b8;
    --warn:      #ffd479;
    --bad:       #ffb0a8;
    --focus:     #9ec8ff;
  }
}

:root[data-a11y="on"][data-theme="dark"] {
  --bg:        #000000;
  --panel:     #0b0e13;
  --sunken:    #141922;
  --ink:       #ffffff;
  --ink-soft:  #dfe5ee;
  --line:      #7d8794;
  --line-firm: #aeb7c4;
  --accent:    #9ec8ff;
  --accent-ink:#000000;
  --accent-bg: #16233a;
  --ok:        #8fe0b8;
  --warn:      #ffd479;
  --bad:       #ffb0a8;
  --focus:     #9ec8ff;
}

:root[data-a11y="on"] body { line-height: 1.8; letter-spacing: 0.01em; }
:root[data-a11y="on"] main { max-width: 60rem; }
:root[data-a11y="on"] :focus-visible { outline-width: 4px; outline-offset: 3px; }
:root[data-a11y="on"] a:not(.at-home):not(.at-card):not(.at-skip) { text-decoration: underline; }
:root[data-a11y="on"] a.at-card { border-width: 2px; }
:root[data-a11y="on"] button,
:root[data-a11y="on"] select,
:root[data-a11y="on"] input[type="number"],
:root[data-a11y="on"] input[type="text"] { min-height: 2.75rem; border-width: 2px; }
:root[data-a11y="on"] .at-seg button { min-height: 2.4rem; padding: 0.4rem 0.75rem; }
:root[data-a11y="on"] .at-lede,
:root[data-a11y="on"] section.at-panel > .at-hint,
:root[data-a11y="on"] .at-caption,
:root[data-a11y="on"] .at-status { color: var(--ink); }
:root[data-a11y="on"] .at-check input { width: 1.3rem; height: 1.3rem; }
:root[data-a11y="on"] section.at-panel { border-width: 2px; }
:root[data-a11y="on"] .at-drop { border-width: 3px; }
:root[data-a11y="on"] table.at-table tbody tr:nth-child(even) { background: var(--sunken); }
:root[data-a11y="on"] canvas.at-canvas { border-width: 2px; }
:root[data-a11y="on"] .at-playhead { width: 4px; }

/* --- responsive / print --------------------------------------------------- */

@media (max-width: 44rem) {
  .at-header { padding: 0.6rem 0.9rem; }
  .at-titles { flex-basis: 100%; order: 3; }
  main { padding: 1.1rem 0.9rem 4rem; }
  .at-console-bar, .at-console-body { padding-left: 0.9rem; padding-right: 0.9rem; }
}

@media print {
  .at-header, .at-console, .at-controls, .at-drop, .at-skip, button { display: none !important; }
  body { background: #fff; color: #000; }
  section.at-panel { border: none; padding: 0; break-inside: avoid; }
  .at-table-wrap { max-height: none; }
}

/* the accessible-mode toggle sits beside the segmented controls */
.at-toggle {
  padding: 0.35rem 0.7rem;
  font-size: 0.78rem;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.at-toggle:hover { background: var(--accent-bg); color: var(--ink); }
.at-toggle[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); font-weight: 650;
}
.at-toggle::before { content: "◐ "; }

/* --- collapsing the chrome -------------------------------------------------
   The header and the console each shrink to a slim strip, so a projector or a
   small laptop screen gives its height to the tool instead. Both states persist.
   -------------------------------------------------------------------------- */

.at-chev {
  flex: none;
  padding: 0.25rem 0.5rem;
  min-height: 0;
  line-height: 1;
  font-size: 0.9rem;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}
.at-chev:hover { background: var(--accent-bg); color: var(--ink); }

.at-header.at-min { padding-top: 0.2rem; padding-bottom: 0.2rem; }
.at-header.at-min .at-tools { display: none; }
.at-header.at-min .at-titles p { display: none; }
.at-header.at-min .at-titles h1 { font-size: 0.88rem; font-weight: 600; }
.at-header.at-min .at-home { padding: 0.2rem 0.5rem; font-size: 0.82rem; }

.at-console.at-min .at-console-bar { padding-top: 0.2rem; padding-bottom: 0.2rem; }
.at-console.at-min .at-only-open { display: none; }
.at-console.at-min .at-console-bar h2 { font-size: 0.72rem; }
</style>
<style>
  .fft-readout { font: 0.85rem var(--mono); color: var(--ink-soft); margin: 0.2rem 0 0.7rem; }
  .fft-readout strong { color: var(--ink); font-weight: 600; }
  .fft-stack .at-caption { margin-top: 0.6rem; }
  canvas.at-canvas.fft-click { cursor: crosshair; }
</style>
</head>
<body data-title="Bac à sable FFT"
      data-title-en="FFT sandbox"
      data-subtitle="ATS · S2 — Le spectrogramme et son réglage"
      data-subtitle-en="ATS · S2 — The spectrogram and its settings"
      data-card="Changer la taille de la fenêtre d’analyse et regarder le spectrogramme du même son devenir net en fréquence ou net en temps — jamais les deux."
      data-card-en="Change the analysis window and watch the spectrogram of the same sound become sharp in frequency or sharp in time — never both."
      data-tag="Son et spectre"
      data-tag-en="Sound and spectrum"
      data-home="index.html">

<main>

<p class="at-lede" data-i18n="lede"></p>

<section class="at-panel" aria-labelledby="h-sound">
  <h2 id="h-sound" data-i18n="s1.title"></h2>
  <p class="at-hint" data-i18n="s1.hint"></p>
  <div class="at-drop" id="drop" data-i18n-attr="aria-label:drop.aria">
    <span data-i18n="drop.main"></span>
    <small data-i18n="drop.formats"></small>
  </div>
  <input type="file" id="file" accept="audio/*" class="at-visually-hidden" data-i18n-attr="aria-label:drop.aria">
  <div class="at-controls" style="margin-top:0.9rem">
    <div class="at-field">
      <label for="demo" data-i18n="demo.label"></label>
      <select id="demo">
        <option value="" data-i18n="demo.none"></option>
        <option value="anatomy" data-i18n="demo.anatomy"></option>
        <option value="sine" data-i18n="demo.sine"></option>
        <option value="sweep" data-i18n="demo.sweep"></option>
        <option value="bell" data-i18n="demo.bell"></option>
        <option value="pluck" data-i18n="demo.pluck"></option>
        <option value="texture" data-i18n="demo.texture"></option>
      </select>
    </div>
  </div>

  Atelier.audio.decodeFile = function (file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error(Atelier.t('err.read'))); };
      reader.onload = function () {
        var ctx = Atelier.audio.ctx();
        ctx.decodeAudioData(reader.result,
          function (buf) { resolve(buf); },
          function () { reject(new Error(Atelier.t('err.decode'))); });
      };
      reader.readAsArrayBuffer(file);
    });

  /** Synthesised demo sounds — the fallback when nobody has a file to hand. */
  Atelier.audio.generate = function (kind, opts) {
    opts = opts || {};
    var ctx = Atelier.audio.ctx();
    var sr = ctx.sampleRate;
    var dur = opts.duration || 3;
    var n = Math.floor(sr * dur);
    var buf = ctx.createBuffer(1, n, sr);
    var x = buf.getChannelData(0);
    var i, t;

    if (kind === 'sine') {
      var f = opts.frequency || 440;
      for (i = 0; i < n; i++) x[i] = 0.7 * Math.sin(2 * Math.PI * f * i / sr);

    } else if (kind === 'sweep') {
      var f0 = 80, f1 = 8000, phase = 0;
      for (i = 0; i < n; i++) {
        phase += 2 * Math.PI * (f0 * Math.pow(f1 / f0, i / n)) / sr;
        x[i] = 0.6 * Math.sin(phase);
      }

    } else if (kind === 'noise') {
      for (i = 0; i < n; i++) x[i] = 0.5 * (Math.random() * 2 - 1);

    } else if (kind === 'bell') {
      var carrier = 520, ratio = 1.41;
      for (i = 0; i < n; i++) {
        t = i / sr;
        x[i] = 0.7 * Math.exp(-t * 2.2) *
               Math.sin(2 * Math.PI * carrier * t +
                        7 * Math.exp(-t * 5) * Math.sin(2 * Math.PI * carrier * ratio * t));
      }

    } else if (kind === 'pluck') {
      var freq = opts.frequency || 196;
      var len = Math.round(sr / freq);
      var ring = new Float32Array(len);
      for (i = 0; i < len; i++) ring[i] = Math.random() * 2 - 1;
      var idx = 0;
      for (i = 0; i < n; i++) {
        var next = (idx + 1) % len;
        ring[idx] = 0.498 * (ring[idx] + ring[next]);
        x[i] = 0.8 * ring[idx] * Math.exp(-i / sr * 0.8);
        idx = next;
      }

    } else if (kind === 'texture') {
      var y1 = 0, y2 = 0;
      for (i = 0; i < n; i++) {
        t = i / sr;
        var cut = 0.02 + 0.35 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 0.25 * t));
        var w = Math.random() * 2 - 1;
        y1 += cut * (w - y1);
        y2 += cut * (y1 - y2);
        x[i] = 0.9 * (y1 - y2) * 6;
      }

    } else {
      throw new Error(Atelier.t('err.unknownDemo', { k: kind }));
    }

    var fade = Math.min(Math.floor(sr * 0.01), Math.floor(n / 2));
    for (i = 0; i < fade; i++) { x[i] *= i / fade; x[n - 1 - i] *= i / fade; }

    src.buffer = buffer;
    src.connect(Atelier.audio.master());
    src.onended = function () {
      if (currentSource === src) currentSource = null;
      if (onEnded) onEnded();
    };
    src.start();
    currentSource = src;
    return src;
  };

  Atelier.audio.stop = function () {

    }

  Atelier.dsp = {};

  Atelier.dsp.mono = function (buffer) {
    var n = buffer.length, ch = buffer.numberOfChannels;
    if (ch === 1) return buffer.getChannelData(0).slice();
    var out = new Float32Array(n);
    for (var c = 0; c < ch; c++) {
      var d = buffer.getChannelData(c);
      for (var i = 0; i < n; i++) out[i] += d[i] / ch;
    }
    return out;
  };

      the argument stack somewhere above ~100k entries). */
  Atelier.dsp.extent = function (values) {
    var lo = Infinity, hi = -Infinity, seen = false;
    for (var i = 0; i < values.length; i++) {
      var v = values[i];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
      seen = true;
    }
    return seen ? { min: lo, max: hi } : null;
  };

  /**
   * Run Meyda over a signal frame by frame, yielding to the browser so the page
   * stays responsive on long files (a one-hour recording is ~300 000 frames).
   *
   * returns Promise<{times, sampleRate, frameSize, hopSize, nFrames, features}>
   * spectralCentroid is converted from bins to hertz; loudness is reduced to its
   * total.
   */
  Atelier.dsp.describe = function (signal, sampleRate, features, opts) {
    opts = opts || {};
    var size = opts.frameSize || 1024;
    var hop = opts.hopSize || Math.floor(size / 2);
    var onProgress = opts.onProgress;

    if (!global.Meyda) return Promise.reject(new Error(Atelier.t('err.noMeyda')));
    if (!Atelier.dsp.isPowerOfTwo(size)) return Promise.reject(new Error(Atelier.t('err.pow2')));

    var M = global.Meyda;
    M.sampleRate = sampleRate;
    M.bufferSize = size;
    M.windowingFunction = 'hanning';

    var nFrames = Math.max(0, Math.floor((signal.length - size) / hop) + 1);
    var out = { times: new Float64Array(nFrames), sampleRate: sampleRate,
                frameSize: size, hopSize: hop, nFrames: nFrames, features: {} };
    // Typed arrays: a one-hour file at 1024/512 is 300k frames per feature.
    features.forEach(function (f) { out.features[f] = new Float64Array(nFrames); });

    var frame = new Float32Array(size);
    var i = 0;
    var CHUNK = 300;

    return new Promise(function (resolve, reject) {
      function step() {
        try {
          var end = Math.min(i + CHUNK, nFrames);
          for (; i < end; i++) {
            var off = i * hop;
            frame.set(signal.subarray(off, off + size));
            var f = M.extract(features, frame);
            out.times[i] = (off + size / 2) / sampleRate;
            for (var k = 0; k < features.length; k++) {
              var name = features[k];
              var v = f[name];
              if (name === 'spectralCentroid') v = v * sampleRate / size;
              else if (name === 'loudness') v = v ? v.total : NaN;
              out.features[name][i] = (typeof v === 'number') ? v : NaN;
            }
          }
          if (onProgress) onProgress(nFrames ? i / nFrames : 1);
          if (i < nFrames) setTimeout(step, 0);
          else resolve(out);
        } catch (err) { reject(err); }
      }
      step();
    });
  };

  Atelier.dsp.envelope = function (signal, width) {
    var per = signal.length / width;
    var mins = new Float32Array(width), maxs = new Float32Array(width);
    for (var c = 0; c < width; c++) {
      var start = Math.floor(c * per), stop = Math.min(Math.floor((c + 1) * per), signal.length);
      if (stop <= start) stop = Math.min(start + 1, signal.length);
      var lo = Infinity, hi = -Infinity;
      for (var i = start; i < stop; i++) {
        var v = signal[i];
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
      mins[c] = isFinite(lo) ? lo : 0;
      maxs[c] = isFinite(hi) ? hi : 0;
    }
    return { mins: mins, maxs: maxs };
  };

  Atelier.draw = {};

  Atelier.draw.fit = function (canvas, cssHeight) {

    var w = canvas.clientWidth || 800;
    var h = cssHeight || 130;

    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };

    opts = opts || {};
    var f = Atelier.draw.fit(canvas, opts.height || 130);
    var ctx = f.ctx, w = f.w, h = f.h, mid = h / 2;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = css('--line');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    canvas._atGeom = { padL: 0, padT: 0, plotW: w, plotH: h };

    var env = Atelier.dsp.envelope(signal, Math.max(1, Math.floor(w)));
    ctx.strokeStyle = opts.color || css('--accent');
    ctx.beginPath();
    for (var c = 0; c < env.mins.length; c++) {
      ctx.moveTo(c + 0.5, mid - env.maxs[c] * mid * 0.94);

  /**
   * Plot one descriptor curve against time. Series longer than the canvas are
   * reduced to a per-pixel min/max band, so a 300 000-point series draws in one
   * pass and still shows its range.
   */
  Atelier.draw.curve = function (canvas, times, values, opts) {
    opts = opts || {};
    var f = Atelier.draw.fit(canvas, opts.height || 130);
    var ctx = f.ctx, w = f.w, h = f.h;
    var padL = 3.6 * parseFloat(getComputedStyle(doc.documentElement).fontSize);
    var padB = 18, padT = 10;
    ctx.clearRect(0, 0, w, h);

    var ext = Atelier.dsp.extent(values);
    if (!ext) return;
    var lo = opts.min !== undefined ? opts.min : ext.min;
    var hi = opts.max !== undefined ? opts.max : ext.max;
    if (hi - lo < 1e-12) hi = lo + 1;

    var plotW = Math.max(10, w - padL - 8), plotH = Math.max(10, h - padT - padB);
    var n = values.length;
    var tMax = n ? times[n - 1] : 1;

    ctx.strokeStyle = css('--line-firm');
    ctx.fillStyle = css('--ink-soft');
    ctx.font = '11px ' + css('--mono');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(Atelier.fmt(hi), padL - 6, padT + 5);
    ctx.fillText(Atelier.fmt(lo), padL - 6, padT + plotH - 5);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('0 s', padL, h - 4);
    ctx.textAlign = 'right';
    ctx.fillText(tMax.toFixed(1) + ' s', padL + plotW, h - 4);
    if (opts.label) {
      ctx.textAlign = 'left';
      ctx.fillStyle = css('--ink');
      ctx.font = '12px ' + css('--sans');
      ctx.fillText(opts.label + (opts.unit ? ' (' + opts.unit + ')' : ''), padL + 6, padT + 11);
    }

    canvas._atGeom = { padL: padL, padT: padT, plotW: plotW, plotH: plotH };

    var y = function (v) { return padT + plotH - ((v - lo) / (hi - lo)) * plotH; };
    ctx.strokeStyle = opts.color || css('--accent');
    ctx.lineWidth = 1.4;
    ctx.beginPath();

    if (n > plotW * 1.5) {
      // Dense series: one vertical min/max stroke per pixel column.
      var cols = Math.floor(plotW);
      var per = n / cols;
      for (var c = 0; c < cols; c++) {
        var s = Math.floor(c * per), e = Math.min(Math.floor((c + 1) * per), n);

        var mn = Infinity, mx = -Infinity;
        for (var i = s; i < e; i++) {

          if (v < mn) mn = v;
          if (v > mx) mx = v;

        var xp = padL + c + 0.5;

      var started = false;
      for (var j = 0; j < n; j++) {
        var val = values[j];
        if (typeof val !== 'number' || !isFinite(val)) { started = false; continue; }
        var xx = padL + (tMax ? times[j] / tMax : 0) * plotW;
        if (!started) { ctx.moveTo(xx, y(val)); started = true; } else { ctx.lineTo(xx, y(val)); }

    if (a >= 1000) return v.toFixed(0);
    if (a >= 10) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.001) return v.toFixed(4);

    }

    function tick() {
      if (!playing) return;
      if (api.time() >= hi() - 0.001) { api.stop(); return; }
      paint();
      raf = global.requestAnimationFrame(tick);
    }

    api.time = function () {
      if (!buffer) return 0;
      if (!playing) return Math.min(Math.max(position, lo()), hi());
      var t = Atelier.audio.ctx().currentTime - startedAt;
      return Math.min(Math.max(t, lo()), hi());
    };

    api.play = function () {
      if (!buffer || playing) return api;
      var ctx = Atelier.audio.ctx();
      Atelier.audio.stop();
      if (position >= hi() - 0.001 || position < lo()) position = lo();
      src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(Atelier.audio.master());
      src.onended = function () {
        if (currentSource === src) currentSource = null;
        if (playing && api.time() >= hi() - 0.01) api.stop();
      };
      startedAt = ctx.currentTime - position;
      src.start(0, position, Math.max(0.01, hi() - position));
      currentSource = src;
      playing = true;
      labels();
      raf = global.requestAnimationFrame(tick);
      return api;
    };

    api.pause = function () {
      if (!playing) return api;
      position = api.time();
      playing = false;
      if (raf) global.cancelAnimationFrame(raf);
      raf = null;
      try { if (src) src.stop(); } catch (e) { /* already stopped */ }
      src = null;
      labels(); paint();
      return api;
    };

    api.stop = function () {
      api.pause();
      position = lo();
      paint();
      return api;
    };

    api.toggle = function () { return playing ? api.pause() : api.play(); };

    api.seek = function (seconds, quiet) {
      if (!buffer) return api;
      position = Math.min(Math.max(seconds, lo()), hi());
      if (playing) { var was = true; api.pause(); if (was) api.play(); }
      paint();
      if (!quiet) {
        for (var i = 0; i < seekListeners.length; i++) seekListeners[i](position);
      }
      return api;
    };

    api.onSeek = function (fn) { seekListeners.push(fn); return api; };

    api.setBuffer = function (buf) {
      api.stop();
      buffer = buf;
      rangeStart = 0; rangeEnd = null;
      position = 0;
      labels(); paint();
      return api;
    };

    api.setRange = function (start, end) {
      rangeStart = start || 0;
      rangeEnd = (end === undefined || end === null) ? null : end;
      position = lo();
      paint();
      return api;
    };

    api.playing = function () { return playing; };
    api.element = function () { return box; };

    /** Give a canvas a playhead and click-to-seek. */
    api.attach = function (canvas) {
      if (!canvas) return api;
      for (var i = 0; i < heads.length; i++) if (heads[i].canvas === canvas) return api;
      var stack = ensureStack(canvas);
      var el = doc.createElement('div');
      el.className = 'at-playhead';
      el.setAttribute('aria-hidden', 'true');
      stack.appendChild(el);
      canvas.classList.add('at-scrubbable');

      var dragging = false;
      function seekFromEvent(e) {
        var r = canvas.getBoundingClientRect();
        var g = geomOf(canvas);
        var u = (e.clientX - r.left - g.padL) / Math.max(1, g.plotW);
        api.seek(lo() + Math.min(1, Math.max(0, u)) * span());
      }
      var onDown = function (e) {
        dragging = true;
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
        seekFromEvent(e);
      };
      var onMove = function (e) { if (dragging) seekFromEvent(e); };
      var onUp = function () { dragging = false; };
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);

      heads.push({ canvas: canvas, el: el,
                   off: function () {
                     canvas.removeEventListener('pointerdown', onDown);
                     canvas.removeEventListener('pointermove', onMove);
                     canvas.removeEventListener('pointerup', onUp);
                     canvas.removeEventListener('pointercancel', onUp);
                     canvas.classList.remove('at-scrubbable');
                     if (el.parentNode) el.parentNode.removeChild(el);
                   } });
      paint();
      return api;
    };

    api.detachAll = function () {
      for (var i = 0; i < heads.length; i++) heads[i].off();
      heads = [];
      return api;
    };

    /** Re-place the playhead after a redraw changed the canvas geometry. */
    api.refresh = function () { paint(); return api; };

    playBtn.addEventListener('click', function () { api.toggle(); });
    stopBtn.addEventListener('click', function () { api.stop(); });
    slider.addEventListener('input', function () {
      api.seek(lo() + (slider.value / 10000) * span());
    });
    slider.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); api.toggle(); }
    });

    Atelier.onLanguageChange(labels);
    labels();
    paint();
    return api;
  };

  global.Atelier = Atelier;
})(window);
</script>
<script>
(function () {
  'use strict';

  Atelier.i18n.add({
    fr: {
      'lede': 'La FFT prend une tranche de son et la décompose en sinusoïdes : c’est le chemin inverse de la synthèse additive. Faire cela tranche après tranche donne le spectrogramme. Mais la tranche a une longueur, et cette longueur est un choix : longue, les fréquences sont nettes et le temps flou ; courte, l’inverse. Il n’y a pas de bon réglage — seulement un réglage bon pour ce que vous voulez entendre.',

      'drop.main': 'Glissez un fichier audio ici, ou appuyez sur Entrée pour en choisir un',

      's2.title': '2. Les réglages',
      's2.hint': 'La taille de fenêtre est le réglage qui compte. Le recouvrement lisse l’image sans rien changer au compromis. La forme de fenêtre (Hann, etc.) atténue les bords de la tranche — comparez avec « rectangulaire » sur une note tenue.',
      'opt.size': 'Taille de fenêtre (échantillons)', 'opt.overlap': 'Recouvrement', 'opt.none': 'aucun',
      'opt.window': 'Forme de fenêtre', 'opt.rect': 'rectangulaire (aucune)',
      'opt.scale': 'Axe des fréquences', 'opt.lin': 'linéaire', 'opt.log': 'logarithmique',
      'opt.range': 'Dynamique affichée',
      'btn.run': 'Calculer le spectrogramme', 'btn.compare': 'Comparer trois tailles',
      'readout': 'Fenêtre de <strong>{size}</strong> échantillons = <strong>{ms} ms</strong> · {bins} bandes de <strong>{hz} Hz</strong> · un pas de {hop} ms → {frames} tranches',
      'prog.aria': 'Progression du calcul',
      'st.running': 'Calcul…', 'st.done': '{n} tranches, {cols} colonnes affichées, {t} s de calcul.',
      'st.failed': 'Échec : {msg}', 'st.tooshort': 'Le son est plus court qu’une fenêtre.',
      's3.title': '3. Le spectrogramme',
      's3.hint': 'Temps de gauche à droite, fréquence de bas en haut, énergie en couleur. Cliquez (ou déplacez-vous au clavier avec ← →) pour voir la tranche : le spectre d’un seul instant, tel que la FFT l’a calculé.',
      'slice.none': 'Cliquez sur le spectrogramme pour afficher le spectre d’un instant.',
      'slice.at': 'Spectre à {t} s — fenêtre de {ms} ms centrée sur cet instant.',
      'slice.aria': 'Spectre à {t} s',
      'spec.label': '{size} échantillons — {ms} ms — {hz} Hz par bande',
      'btn.png': 'Exporter l’image (PNG)',
      's4.title': '4. Trois tailles, un son',
      's4.hint': 'Même son, même échelle. Regardez les clics (verticaux) et la note (horizontale) : laquelle des trois images est « juste » ? Aucune. Chacune choisit.',
      'cmp.running': 'Calcul de {size}…'
    },
    en: {
      'lede': 'The FFT takes a slice of sound and breaks it into sines: the reverse of additive synthesis. Doing that slice after slice gives the spectrogram. But the slice has a length, and that length is a choice: long, frequencies are sharp and time blurred; short, the reverse. There is no right setting — only a setting that is right for what you want to hear.',
      's1.title': '1. The sound',
      's1.hint': 'The “anatomy” sound was made for this page: a held note, regular clicks and a burst of noise. Each of the three reacts differently to the window size. Nothing is uploaded anywhere.',
      'drop.main': 'Drop an audio file here, or press Enter to choose one',
      'drop.formats': 'WAV, MP3, FLAC, M4A, OGG', 'drop.aria': 'Choose an audio file',
      'demo.label': 'Demo sound', 'demo.none': '—',
      'demo.anatomy': 'Anatomy: note + clicks + noise', 'demo.sine': '440 Hz sine',
      'demo.sweep': 'Sweep 80 Hz → 8 kHz', 'demo.bell': 'Bell (FM)', 'demo.pluck': 'Plucked string',
      'demo.texture': 'Drifting filtered texture',
      'btn.play': '▶ Play', 'btn.stop': '■ Stop',
      'caption.none': 'No sound loaded.',
      'caption.loaded': '{name} — {dur} s · {sr} Hz',
      'st.loaded': 'Sound loaded.', 'st.decoding': 'Decoding “{name}”…',
      's2.title': '2. The settings',
      's2.hint': 'Window size is the setting that matters. Overlap smooths the picture without changing the trade-off. The window shape (Hann, etc.) softens the edges of the slice — compare with “rectangular” on a held note.',
      'opt.size': 'Window size (samples)', 'opt.overlap': 'Overlap', 'opt.none': 'none',
      'opt.window': 'Window shape', 'opt.rect': 'rectangular (none)',
      'opt.scale': 'Frequency axis', 'opt.lin': 'linear', 'opt.log': 'logarithmic',
      'opt.range': 'Displayed range',
      'btn.run': 'Compute the spectrogram', 'btn.compare': 'Compare three sizes',
      'readout': 'Window of <strong>{size}</strong> samples = <strong>{ms} ms</strong> · {bins} bands of <strong>{hz} Hz</strong> · a hop of {hop} ms → {frames} slices',
      'prog.aria': 'Computation progress',
      'st.running': 'Computing…', 'st.done': '{n} slices, {cols} columns shown, {t} s of computation.',
      'st.failed': 'Failed: {msg}', 'st.tooshort': 'The sound is shorter than one window.',
      's3.title': '3. The spectrogram',
      's3.hint': 'Time left to right, frequency bottom to top, energy as colour. Click (or move with ← → on the keyboard) to see the slice: the spectrum of a single instant, as the FFT computed it.',
      'slice.none': 'Click on the spectrogram to show the spectrum of one instant.',
      'slice.at': 'Spectrum at {t} s — {ms} ms window centred on that instant.',
      'slice.aria': 'Spectrum at {t} s',
      'spec.label': '{size} samples — {ms} ms — {hz} Hz per band',
      'btn.png': 'Export the picture (PNG)',
      's4.title': '4. Three sizes, one sound',
      's4.hint': 'Same sound, same scale. Look at the clicks (vertical) and the note (horizontal): which of the three pictures is “right”? None. Each one chooses.',
      'cmp.running': 'Computing {size}…'
    }
  });

  Atelier.init();

  var $ = function (id) { return document.getElementById(id); };
  var buffer = null, signal = null, srcName = '', spec = null, cursorT = null;
  var tp = Atelier.transport.create({ mount: $('transport') });
  var compared = [];   // [{size, spec}]

  /* --- the anatomy demo: held tone + clicks + a noise burst --------------- */
  function anatomy() {
    var ctx = Atelier.audio.ctx(), sr = ctx.sampleRate, dur = 4, n = sr * dur;
    var b = ctx.createBuffer(1, n, sr), x = b.getChannelData(0), i, t;
    for (i = 0; i < n; i++) {
      t = i / sr;
      var tone = 0.35 * Math.sin(2 * Math.PI * 330 * t) + 0.12 * Math.sin(2 * Math.PI * 660 * t) +
                 0.08 * Math.sin(2 * Math.PI * 990 * t);
      var env = Math.min(1, t * 8) * Math.min(1, (dur - t) * 8);
      var click = 0;
      var phase = (t * 4) % 1;                    // 4 clicks per second
      if (phase < 0.002) click = 0.9 * (1 - phase / 0.002) * (Math.random() * 2 - 1);
      var burst = (t > 2.6 && t < 2.9) ? 0.5 * (Math.random() * 2 - 1) * Math.sin(Math.PI * (t - 2.6) / 0.3) : 0;
      x[i] = env * tone + click + burst;
    }
    return b;
  }

  function adopt(buf, name) {
    buffer = buf; srcName = name; spec = null; compared = [];
    signal = Atelier.dsp.mono(buf);
    $('wave-caption').textContent = Atelier.t('caption.loaded', { name: name, dur: buf.duration.toFixed(2), sr: buf.sampleRate });
    Atelier.draw.waveform($('wave'), signal, { label: name, height: 90 });
    $('run').disabled = $('compare').disabled = false;
    tp.setBuffer(buf);
    tp.detachAll();
    tp.attach($('wave'));
    $('results').hidden = true; $('cmp').hidden = true;
    Atelier.status($('load-status'), Atelier.t('st.loaded'), 'ok');
    Atelier.log.ok(name + ' — ' + buf.duration.toFixed(2) + ' s, ' + buf.sampleRate + ' Hz');
    readout();
  }

  Atelier.io.dropzone($('drop'), $('file'), function (file) {
    Atelier.status($('load-status'), Atelier.t('st.decoding', { name: file.name }));
    Atelier.audio.decodeFile(file).then(function (b) { $('demo').value = ''; adopt(b, file.name); })
      .catch(function (e) { Atelier.status($('load-status'), e.message, 'bad'); });
  });
  $('demo').addEventListener('change', function () {
    if (!this.value) return;
    try {
      adopt(this.value === 'anatomy' ? anatomy() : Atelier.audio.generate(this.value, { duration: 4 }),
            this.options[this.selectedIndex].textContent);
    } catch (e) { Atelier.status($('load-status'), e.message, 'bad'); }
  });
  /* --- parameters --------------------------------------------------------- */

  function params() {
    var size = parseInt($('size').value, 10);
    var hop = Math.max(1, Math.round(size * (1 - parseFloat($('overlap').value))));
    return { size: size, hop: hop, win: $('win').value };
  }

  function readout() {
    var p = params(), sr = buffer ? buffer.sampleRate : 44100;
    var frames = buffer ? Math.max(0, Math.floor((signal.length - p.size) / p.hop) + 1) : 0;
    $('readout').innerHTML = Atelier.t('readout', {
      size: p.size, ms: (p.size / sr * 1000).toFixed(1), bins: (p.size / 2 + 1),
      hz: (sr / p.size).toFixed(1), hop: (p.hop / sr * 1000).toFixed(1),
      frames: frames.toLocaleString(Atelier.lang())
    });
  }
  ['size', 'overlap', 'win'].forEach(function (id) { $(id).addEventListener('change', readout); });
  ['scale', 'range'].forEach(function (id) { $(id).addEventListener('change', function () { drawSpec(); drawCompare(); }); });

  /* --- compute ------------------------------------------------------------ */

  function compute(size, hop, win, onProgress) {
    return Atelier.dsp.spectrogram(signal, buffer.sampleRate, {
      frameSize: size, hopSize: hop, window: win, maxColumns: 3000, onProgress: onProgress
    });
  }

  $('run').addEventListener('click', function () {
    var p = params();
    if (signal.length < p.size) { Atelier.status($('run-status'), Atelier.t('st.tooshort'), 'bad'); return; }
    $('run').disabled = $('compare').disabled = true;
    $('prog').hidden = false; $('prog').value = 0;
    Atelier.status($('run-status'), Atelier.t('st.running'));
    var t0 = performance.now();
    compute(p.size, p.hop, p.win, function (v) { $('prog').value = v; }).then(function (s) {
      spec = s; cursorT = null;
      $('prog').hidden = true; $('run').disabled = $('compare').disabled = false;
      $('results').hidden = false;
      tp.detachAll(); tp.attach($('wave')); tp.attach($('spec'));
      Atelier.status($('run-status'), Atelier.t('st.done', {
        n: s.nFrames.toLocaleString(Atelier.lang()), cols: s.columns, t: ((performance.now() - t0) / 1000).toFixed(1)
      }), 'ok');
      drawSpec(); drawSlice();
    }).catch(function (e) {
      $('prog').hidden = true; $('run').disabled = $('compare').disabled = false;
      Atelier.status($('run-status'), Atelier.t('st.failed', { msg: e.message }), 'bad');
    });
  });

  $('compare').addEventListener('click', function () {
    var sizes = [256, 1024, 4096], p = params();
    $('run').disabled = $('compare').disabled = true;
    $('prog').hidden = false; $('prog').value = 0;
    compared = [];
    var i = 0;
    function next() {
      if (i >= sizes.length) {
        $('prog').hidden = true; $('run').disabled = $('compare').disabled = false;
        $('cmp').hidden = false; drawCompare();
        Atelier.status($('run-status'), '', '');
        return;
      }
      var size = sizes[i], hop = Math.max(1, Math.round(size * (1 - parseFloat($('overlap').value))));
      Atelier.status($('run-status'), Atelier.t('cmp.running', { size: size }));
      compute(size, hop, p.win, function (v) { $('prog').value = (i + v) / sizes.length; }).then(function (s) {
        compared.push({ size: size, spec: s }); i++; next();
      }).catch(function (e) {
        $('prog').hidden = true; $('run').disabled = $('compare').disabled = false;
        Atelier.status($('run-status'), Atelier.t('st.failed', { msg: e.message }), 'bad');
      });
    }
    next();
  });

  /* --- draw ---------------------------------------------------------------- */

  var specGeom = null;

  function specLabel(s) {
    return Atelier.t('spec.label', { size: s.frameSize, ms: (s.frameSize / s.sampleRate * 1000).toFixed(1),
                                     hz: (s.sampleRate / s.frameSize).toFixed(1) });
  }

  function drawSpec() {
    if (!spec) return;
    specGeom = Atelier.draw.spectrogram($('spec'), spec, {
      height: 300, logFreq: $('scale').value === 'log', dbRange: parseInt($('range').value, 10),
      label: specLabel(spec)
    });
    tp.refresh();
  }

  function drawCompare() {
    if (!compared.length) return;
    var host = $('stack');
    host.innerHTML = '';
    compared.forEach(function (c) {
      var wrap = document.createElement('div'); wrap.className = 'at-canvas-wrap';
      var cv = document.createElement('canvas'); cv.className = 'at-canvas';
      wrap.appendChild(cv); host.appendChild(wrap);
      Atelier.draw.spectrogram(cv, c.spec, {
        height: 190, logFreq: $('scale').value === 'log', dbRange: parseInt($('range').value, 10),
        label: specLabel(c.spec)
      });
    });
  }

  function drawSlice() {
    var cv = $('slice');
    if (!spec || cursorT === null) {
      Atelier.draw.fit(cv, 150).ctx.clearRect(0, 0, 4000, 400);
      $('slice-caption').textContent = Atelier.t('slice.none');
      return;
    }
    var size = spec.frameSize, sr = spec.sampleRate;
    var centre = Math.round(cursorT * sr), start = Math.max(0, Math.min(signal.length - size, centre - size / 2));
    var frame = signal.subarray(start, start + size);
    var mag = Atelier.dsp.magnitude(frame, Atelier.dsp.window(size, $('win').value));
    var db = new Float64Array(mag.length), freqs = new Float64Array(mag.length);
    var top = 20 * Math.log10(spec.maxMag || 1e-9), rng = parseInt($('range').value, 10);
    for (var k = 0; k < mag.length; k++) {
      db[k] = Math.max(top - rng, 20 * Math.log10(mag[k] > 1e-12 ? mag[k] : 1e-12));
      freqs[k] = k * sr / size;
    }
    Atelier.draw.curve(cv, freqs, db, { label: Atelier.t('slice.aria', { t: cursorT.toFixed(2) }), unit: 'dB',
                                        min: top - rng, max: top, height: 150 });
    // curve() labels the x axis in seconds; overwrite with hertz
    var f = cv.getContext('2d'), w = cv.clientWidth, h = cv.clientHeight;
    var cssv = function (n) { return getComputedStyle(document.body).getPropertyValue(n).trim(); };
    f.fillStyle = cssv('--sunken'); f.fillRect(0, h - 16, w, 16);
    f.fillStyle = cssv('--ink-soft'); f.font = '11px ' + cssv('--mono');
    f.textAlign = 'left'; f.fillText('0 Hz', 3.6 * 16, h - 4);
    f.textAlign = 'right'; f.fillText((sr / 2 / 1000).toFixed(1) + ' kHz', w - 8, h - 4);
    $('slice-caption').textContent = Atelier.t('slice.at', { t: cursorT.toFixed(2), ms: (size / sr * 1000).toFixed(1) });
  }

  // Scrubbing and inspecting are the same gesture here: wherever the playhead is,
  // that is the slice the spectrum below shows.
  tp.onSeek(function (t) { cursorT = t; drawSlice(); });
  $('spec').addEventListener('keydown', function (e) {
    if (!spec) return;
    var step = spec.duration / 100;
    if (e.key === 'ArrowLeft') tp.seek((cursorT || 0) - step);
    else if (e.key === 'ArrowRight') tp.seek((cursorT || 0) + step);
    else if (e.key === 'Enter' || e.key === ' ') tp.toggle();
    else return;
    e.preventDefault();
  });

  $('png').addEventListener('click', function () { Atelier.io.png($('spec'), 'spectrogramme_' + (spec ? spec.frameSize : '') + '.png'); });

  function redraw() {
    if (signal) Atelier.draw.waveform($('wave'), signal, { label: srcName, height: 90 });
    readout(); drawSpec(); drawSlice(); drawCompare();
    tp.refresh();
  }
  Atelier.onRedraw(redraw);
  Atelier.onLanguageChange(function () {
    $('wave-caption').textContent = buffer ? Atelier.t('caption.loaded', { name: srcName, dur: buffer.duration.toFixed(2), sr: buffer.sampleRate }) : Atelier.t('caption.none');
    redraw();
  });
  var t = null;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(redraw, 180); });
  readout();
})();
</script>
