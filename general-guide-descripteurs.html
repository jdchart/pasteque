<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide des descripteurs</title>
<style>
/* ---------------------------------------------------------------------------
   Atelier — shared stylesheet for the course web tools.

   Themes: light / dark / auto. `data-theme` on <html> wins; with no attribute the
   OS preference decides. Every colour pair below is checked for WCAG AA contrast
   (4.5:1 body text, 3:1 large text and UI borders).

   Sizes are in rem so the text-size control scales the whole interface.
   --------------------------------------------------------------------------- */

:root {
  --ui-scale: 1;

  --bg:        #eef0f4;
  --panel:     #ffffff;
  --sunken:    #f6f7f9;
  --ink:       #12161c;   /* 16.9:1 on --panel */
  --ink-soft:  #4d5764;   /*  7.6:1 on --panel */
  --line:      #c8cdd6;
  --line-firm: #9aa3b1;
  --accent:    #14549e;   /*  7.1:1 on --panel */
  --accent-ink:#ffffff;
  --accent-bg: #e4ecf7;
  --ok:        #12664a;   /*  6.4:1 */
  --warn:      #7a5200;   /*  6.2:1 */
  --bad:       #a41f1a;   /*  6.6:1 */
  --focus:     #14549e;

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0e1116;
    --panel:     #171b22;
    --sunken:    #10141a;
    --ink:       #e8ecf2;   /* 13.8:1 on --panel */
    --ink-soft:  #a3adbb;   /*  6.9:1 on --panel */
    --line:      #2b323d;
    --line-firm: #4a545f;
    --accent:    #7fb4ff;   /*  7.6:1 on --panel */
    --accent-ink:#0e1116;
    --accent-bg: #1b2634;
    --ok:        #6cc79c;
    --warn:      #e0b354;
    --bad:       #ff9086;
    --focus:     #7fb4ff;
  }
}

:root[data-theme="dark"] {
  --bg:        #0e1116;
  --panel:     #171b22;
  --sunken:    #10141a;
  --ink:       #e8ecf2;
  --ink-soft:  #a3adbb;
  --line:      #2b323d;
  --line-firm: #4a545f;
  --accent:    #7fb4ff;
  --accent-ink:#0e1116;
  --accent-bg: #1b2634;
  --ok:        #6cc79c;
  --warn:      #e0b354;
  --bad:       #ff9086;
  --focus:     #7fb4ff;
}

/* Respect a user asking the OS for more contrast. */
@media (prefers-contrast: more) {
  :root { --line: var(--line-firm); --ink-soft: var(--ink); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

* { box-sizing: border-box; }

html { font-size: calc(100% * var(--ui-scale)); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  /* Column layout so the console sits on the bottom edge even when the page is
     shorter than the window; `position: sticky` alone only pins it once there is
     something to scroll. */
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main { flex: 1 0 auto; }

/* Visible focus for every interactive element, keyboard or not. */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

.at-skip {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 10px 16px;
  z-index: 100;
  border-radius: 0 0 var(--radius) 0;
}
.at-skip:focus { left: 0; }

.at-visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

/* --- header --------------------------------------------------------------- */

.at-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
  padding: 0.6rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.at-home {
  flex: none;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
  padding: 0.4rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.at-home:hover { background: var(--accent-bg); }

.at-titles { flex: 1 1 14rem; min-width: 0; }
.at-titles h1 { margin: 0; font-size: 1.05rem; font-weight: 650; line-height: 1.3; }
.at-titles p  { margin: 0; font-size: 0.8rem; color: var(--ink-soft); line-height: 1.35; }

.at-tools { flex: none; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

.at-seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.at-seg button {
  border: 0;
  border-radius: 0;
  padding: 0.35rem 0.6rem;
  font-size: 0.78rem;
  background: transparent;
  color: var(--ink-soft);
  min-width: 2.4rem;
}
.at-seg button + button { border-left: 1px solid var(--line); }
.at-seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 650;
}
.at-seg button:hover:not([aria-pressed="true"]) { background: var(--accent-bg); color: var(--ink); }

/* --- layout --------------------------------------------------------------- */

main { width: 100%; max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }

.at-lede { font-size: 1.02rem; color: var(--ink-soft); margin: 0 0 1.5rem; max-width: 68ch; }
.at-lede strong { color: var(--ink); }

section.at-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  margin: 0 0 1.35rem;
}
section.at-panel > h2 { margin: 0 0 0.25rem; font-size: 1rem; line-height: 1.35; }
section.at-panel > .at-hint {
  margin: 0 0 0.85rem; font-size: 0.88rem; color: var(--ink-soft); max-width: 70ch;
}

/* --- controls ------------------------------------------------------------- */

.at-controls { display: flex; flex-wrap: wrap; gap: 0.7rem 0.9rem; align-items: flex-end;
               margin-bottom: 0.9rem; }
.at-field { display: flex; flex-direction: column; gap: 0.25rem; }
.at-field > label, .at-fieldset > legend {
  font-size: 0.75rem; color: var(--ink-soft); text-transform: uppercase;
  letter-spacing: 0.05em; font-weight: 600;
}

button, select, input[type="number"], input[type="text"] {
  font: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--sunken);
  border: 1px solid var(--line-firm);
  border-radius: var(--radius);
  padding: 0.45rem 0.7rem;
  min-height: 2.25rem;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.at-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.at-primary:hover:not(:disabled) { filter: brightness(1.12); color: var(--accent-ink); }

.at-fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 0.6rem 0.8rem; }
.at-checks { display: grid; gap: 0.2rem 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.at-check { display: flex; align-items: baseline; gap: 0.45rem; font-size: 0.88rem; }
.at-check input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); flex: none; }
.at-check code { font: 0.82rem var(--mono); color: var(--ink-soft); }

/* --- drop zone ------------------------------------------------------------ */

.at-drop {
  display: block;
  width: 100%;
  border: 2px dashed var(--line-firm);
  border-radius: var(--radius);
  padding: 1.35rem;
  text-align: center;
  color: var(--ink-soft);
  background: var(--sunken);
  font-size: 0.92rem;
  transition: background 0.15s, border-color 0.15s;
}
.at-drop:hover { border-color: var(--accent); color: var(--ink); }
.at-drop.at-over { border-color: var(--accent); background: var(--accent-bg); color: var(--ink); }
.at-drop small { display: block; margin-top: 0.3rem; font-size: 0.8rem; }

/* --- canvases ------------------------------------------------------------- */

.at-canvas-wrap { overflow-x: auto; margin: 0 0 0.4rem; }

/* The stack is created by Atelier.transport when a canvas gets a playhead: the
   overlay must scroll with the canvas, so it is positioned against a box the same
   width as the canvas rather than against the scrolling wrapper. */
.at-canvas-stack { position: relative; width: 100%; min-width: 32rem; }
.at-playhead {
  position: absolute;
  width: 2px;
  background: var(--bad);
  pointer-events: none;
  display: none;
  z-index: 2;
}
canvas.at-scrubbable { cursor: ew-resize; touch-action: none; }

/* --- transport ------------------------------------------------------------ */

.at-transport {
  display: flex; align-items: center; gap: 0.5rem 0.7rem; flex-wrap: wrap;
  margin: 0.6rem 0 0.7rem;
}
.at-transport input[type="range"] {
  flex: 1 1 12rem; min-width: 7rem; accent-color: var(--accent);
}
.at-transport button { min-width: 5.5rem; }
.at-time { font: 0.82rem var(--mono); color: var(--ink-soft); white-space: nowrap; }
canvas.at-canvas {
  display: block;
  width: 100%;
  min-width: 32rem;
  height: auto;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.at-caption { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.35rem; }

/* --- tables --------------------------------------------------------------- */

.at-table-wrap { overflow: auto; max-height: 22rem; border: 1px solid var(--line); border-radius: 4px; }
table.at-table { border-collapse: collapse; width: 100%; font: 0.82rem var(--mono); }
table.at-table caption { text-align: left; padding: 0.4rem 0.6rem; color: var(--ink-soft);
                         font: 0.8rem var(--sans); }
table.at-table th, table.at-table td { padding: 0.3rem 0.65rem; text-align: right; white-space: nowrap; }
table.at-table th { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line-firm); }
table.at-table th button {
  all: unset; cursor: pointer; font: inherit; font-weight: 650; color: var(--ink);
  padding: 0.15rem 0.2rem;
}
table.at-table th button:hover { color: var(--accent); text-decoration: underline; }
table.at-table th:first-child, table.at-table td:first-child { text-align: left; }
table.at-table tbody tr:nth-child(even) { background: var(--sunken); }

/* --- status / progress ---------------------------------------------------- */

.at-status { font-size: 0.87rem; color: var(--ink-soft); min-height: 1.5em; margin: 0.5rem 0 0; }
.at-status.ok  { color: var(--ok); }
.at-status.bad { color: var(--bad); }
.at-status::before { font-weight: 700; margin-right: 0.4rem; }
.at-status.ok::before  { content: "OK"; }
.at-status.bad::before { content: "!"; }

progress { width: 100%; height: 0.5rem; accent-color: var(--accent); }
progress[hidden] { display: none; }

/* --- console -------------------------------------------------------------- */

.at-console {
  position: sticky;
  bottom: 0;
  z-index: 15;
  background: var(--panel);
  border-top: 1px solid var(--line-firm);
}
.at-console-bar {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.35rem 1.25rem;
}
.at-console-bar h2 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
                     color: var(--ink-soft); font-weight: 650; }
.at-console-count { font: 0.78rem var(--mono); color: var(--ink-soft); }
.at-console-count.bad { color: var(--bad); font-weight: 700; }
.at-console-bar .at-spacer { flex: 1; }
.at-console-bar button { padding: 0.25rem 0.55rem; font-size: 0.78rem; min-height: 0; }

.at-console-body {
  max-height: 13rem;
  overflow-y: auto;
  margin: 0;
  padding: 0.5rem 1.25rem 0.8rem;
  border-top: 1px solid var(--line);
  background: var(--sunken);
  font: 0.82rem/1.5 var(--mono);
  list-style: none;
}
.at-console-body[hidden] { display: none; }
.at-console-body li { display: flex; gap: 0.6rem; padding: 0.08rem 0; }
.at-console-body .at-time { color: var(--ink-soft); flex: none; }
.at-console-body .at-lvl { flex: none; font-weight: 700; min-width: 3.6rem; }
.at-console-body .at-lvl.info { color: var(--ink-soft); }
.at-console-body .at-lvl.ok   { color: var(--ok); }
.at-console-body .at-lvl.warn { color: var(--warn); }
.at-console-body .at-lvl.err  { color: var(--bad); }
.at-console-body .at-msg { white-space: pre-wrap; word-break: break-word; }

/* --- homepage cards ------------------------------------------------------- */

.at-grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
a.at-card {
  display: block; padding: 1rem 1.1rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: inherit;
}
a.at-card:hover { border-color: var(--accent); background: var(--accent-bg); }
a.at-card h3 { margin: 0 0 0.25rem; font-size: 0.98rem; color: var(--accent); }
a.at-card p  { margin: 0; font-size: 0.87rem; color: var(--ink-soft); }
.at-card[aria-disabled="true"] { opacity: 0.6; }
.at-tag {
  display: inline-block; font: 0.72rem var(--mono); text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--ink-soft);
  border: 1px solid var(--line-firm); border-radius: 3px;
  padding: 0.05rem 0.4rem; margin-bottom: 0.5rem;
}

/* --- accessible mode ------------------------------------------------------
   Opt-in, via the toggle in the header (data-a11y="on" on <html>). The baseline
   theme is already AA-contrast, keyboard-operable and motion-safe; this goes
   further — near-maximum contrast, bigger type, more space, underlined links,
   larger hit targets — for anyone who wants it, without imposing it on everyone.
   -------------------------------------------------------------------------- */

:root[data-a11y="on"] {
  --ui-scale: 1.15;
  --bg:        #ffffff;
  --panel:     #ffffff;
  --sunken:    #eef1f5;
  --ink:       #000000;   /* 21:1 */
  --ink-soft:  #1f2530;   /* 15.3:1 — no low-contrast greys in this mode */
  --line:      #5c6673;
  --line-firm: #2b323d;
  --accent:    #0a3d7a;   /* 10.5:1 */
  --accent-ink:#ffffff;
  --accent-bg: #dce7f5;
  --ok:        #04513a;
  --warn:      #5c3d00;
  --bad:       #8a1410;
  --focus:     #0a3d7a;
}

@media (prefers-color-scheme: dark) {
  :root[data-a11y="on"]:not([data-theme="light"]) {
    --bg:        #000000;
    --panel:     #0b0e13;
    --sunken:    #141922;
    --ink:       #ffffff;
    --ink-soft:  #dfe5ee;
    --line:      #7d8794;
    --line-firm: #aeb7c4;
    --accent:    #9ec8ff;   /* 11.4:1 on --panel */
    --accent-ink:#000000;
    --accent-bg: #16233a;
    --ok:        #8fe0b8;
    --warn:      #ffd479;
    --bad:       #ffb0a8;
    --focus:     #9ec8ff;
  }
}

:root[data-a11y="on"][data-theme="dark"] {
  --bg:        #000000;
  --panel:     #0b0e13;
  --sunken:    #141922;
  --ink:       #ffffff;
  --ink-soft:  #dfe5ee;
  --line:      #7d8794;
  --line-firm: #aeb7c4;
  --accent:    #9ec8ff;
  --accent-ink:#000000;
  --accent-bg: #16233a;
  --ok:        #8fe0b8;
  --warn:      #ffd479;
  --bad:       #ffb0a8;
  --focus:     #9ec8ff;
}

:root[data-a11y="on"] body { line-height: 1.8; letter-spacing: 0.01em; }
:root[data-a11y="on"] main { max-width: 60rem; }
:root[data-a11y="on"] :focus-visible { outline-width: 4px; outline-offset: 3px; }
:root[data-a11y="on"] a:not(.at-home):not(.at-card):not(.at-skip) { text-decoration: underline; }
:root[data-a11y="on"] a.at-card { border-width: 2px; }
:root[data-a11y="on"] button,
:root[data-a11y="on"] select,
:root[data-a11y="on"] input[type="number"],
:root[data-a11y="on"] input[type="text"] { min-height: 2.75rem; border-width: 2px; }
:root[data-a11y="on"] .at-seg button { min-height: 2.4rem; padding: 0.4rem 0.75rem; }
:root[data-a11y="on"] .at-lede,
:root[data-a11y="on"] section.at-panel > .at-hint,
:root[data-a11y="on"] .at-caption,
:root[data-a11y="on"] .at-status { color: var(--ink); }
:root[data-a11y="on"] .at-check input { width: 1.3rem; height: 1.3rem; }
:root[data-a11y="on"] section.at-panel { border-width: 2px; }
:root[data-a11y="on"] .at-drop { border-width: 3px; }
:root[data-a11y="on"] table.at-table tbody tr:nth-child(even) { background: var(--sunken); }
:root[data-a11y="on"] canvas.at-canvas { border-width: 2px; }
:root[data-a11y="on"] .at-playhead { width: 4px; }

/* --- responsive / print --------------------------------------------------- */

@media (max-width: 44rem) {
  .at-header { padding: 0.6rem 0.9rem; }
  .at-titles { flex-basis: 100%; order: 3; }
  main { padding: 1.1rem 0.9rem 4rem; }
  .at-console-bar, .at-console-body { padding-left: 0.9rem; padding-right: 0.9rem; }
}

@media print {
  .at-header, .at-console, .at-controls, .at-drop, .at-skip, button { display: none !important; }
  body { background: #fff; color: #000; }
  section.at-panel { border: none; padding: 0; break-inside: avoid; }
  .at-table-wrap { max-height: none; }
}

/* the accessible-mode toggle sits beside the segmented controls */
.at-toggle {
  padding: 0.35rem 0.7rem;
  font-size: 0.78rem;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.at-toggle:hover { background: var(--accent-bg); color: var(--ink); }
.at-toggle[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); font-weight: 650;
}
.at-toggle::before { content: "◐ "; }

/* --- collapsing the chrome -------------------------------------------------
   The header and the console each shrink to a slim strip, so a projector or a
   small laptop screen gives its height to the tool instead. Both states persist.
   -------------------------------------------------------------------------- */

.at-chev {
  flex: none;
  padding: 0.25rem 0.5rem;
  min-height: 0;
  line-height: 1;
  font-size: 0.9rem;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}
.at-chev:hover { background: var(--accent-bg); color: var(--ink); }

.at-header.at-min { padding-top: 0.2rem; padding-bottom: 0.2rem; }
.at-header.at-min .at-tools { display: none; }
.at-header.at-min .at-titles p { display: none; }
.at-header.at-min .at-titles h1 { font-size: 0.88rem; font-weight: 600; }
.at-header.at-min .at-home { padding: 0.2rem 0.5rem; font-size: 0.82rem; }

.at-console.at-min .at-console-bar { padding-top: 0.2rem; padding-bottom: 0.2rem; }
.at-console.at-min .at-only-open { display: none; }
.at-console.at-min .at-console-bar h2 { font-size: 0.72rem; }
</style>

             margin: 0 0 0; padding: 0; }

            background: var(--sunken); border: 1px solid var(--line); border-bottom: none;

            margin-bottom: -1px; }
  .gd-tab:hover { color: var(--accent); }

  .gd-tabpanel { border-top-left-radius: 0; margin-top: 0; }

  @media (max-width: 860px) { .gd-cols { grid-template-columns: minmax(0, 1fr); } }

<body data-title="Guide des descripteurs"
      data-title-en="Descriptor guide"
      data-subtitle="Onze descripteurs, un par onglet"
      data-subtitle-en="Eleven descriptors, one per tab"
      data-card="Un onglet par descripteur (RMS, sonie, hauteur, centroïde, étalement, planéité, rolloff, passages par zéro, flux, MFCC, chroma), avec son fonctionnement, ses pièges, des sons d’exemple et votre propre son."
      data-card-en="One tab per descriptor (RMS, loudness, pitch, centroid, spread, flatness, rolloff, zero crossings, flux, MFCC, chroma), with how it works, its pitfalls, example sounds and your own sound."
      data-tag="Écoute et analyse"
      data-tag-en="Listening and analysis"
      data-home="index.html">

<main>

<p class="at-lede" data-i18n="lede"></p>

<details class="gd-common">
  <summary data-i18n="common.title"></summary>
  <ul>
    <li data-i18n="common.1"></li>
    <li data-i18n="common.2"></li>
    <li data-i18n="common.3"></li>
    <li data-i18n="common.4"></li>
  </ul>
</details>

<div class="gd-tabs" role="tablist" id="tabs" data-i18n-attr="aria-label:tabs.aria"></div>

<section class="at-panel gd-tabpanel" id="panel" role="tabpanel" tabindex="0">
  <div class="gd-head"><h2 id="d-name"></h2><code id="d-code"></code></div>
  <div class="gd-cols">
    <div>
      <h3 data-i18n="h.what"></h3><p id="d-what"></p>
      <h3 data-i18n="h.how"></h3><p id="d-how"></p>
      <h3 data-i18n="h.tool"></h3><p id="d-tool"></p>
    </div>
    <div class="gd-traps">
      <h3 data-i18n="h.traps"></h3>
      <ul id="d-traps"></ul>
    </div>
  </div>
  <h3 style="margin-top:1.2rem" data-i18n="h.examples"></h3>
  <p class="at-hint" data-i18n="ex.hint"></p>
  <ul class="gd-ex" id="d-ex"></ul>
</section>

<section class="at-panel" aria-labelledby="h-work">
  <h2 id="h-work" data-i18n="w.title"></h2>
  <p class="at-hint" data-i18n="w.hint"></p>

  <div class="at-drop" id="drop" data-i18n-attr="aria-label:drop.aria">
    <span data-i18n="drop.main"></span>
    <small data-i18n="drop.formats"></small>
  </div>
  <input type="file" id="file" accept="audio/*" class="at-visually-hidden"

  <div class="at-controls" style="margin-top:0.9rem">
    <div class="at-field">

        <option value="1024" selected>1024</option>
        <option value="2048">2048</option>
        <option value="4096">4096</option>

    </div>
  </div>
  <p class="at-hint" id="frame-hint"></p>

  <div id="transport"></div>
  <p class="at-caption" id="wave-caption"></p>
  <div class="at-canvas-wrap"><canvas class="at-canvas" id="wave" role="img"></canvas></div>
  <div class="at-canvas-wrap"><canvas class="at-canvas" id="curve" role="img"></canvas></div>
  <progress id="prog" max="1" value="0" hidden data-i18n-attr="aria-label:prog.aria"></progress>
  <p class="at-status" id="status"></p>
  <p class="gd-readout" id="stats"></p>

  <h3 style="margin-top:1.2rem" data-i18n="loupe.title"></h3>
  <p class="at-hint" data-i18n="loupe.hint"></p>
  <div class="at-controls" id="loupe-opts" style="display:none">
    <label class="at-check"><input type="checkbox" id="logf"> <span data-i18n="loupe.log"></span></label>
  </div>

  <div class="at-canvas-wrap"><canvas class="at-canvas" id="loupe" role="img"></canvas></div>
  <div class="gd-legend" id="loupe-legend"></div>
</section>

  Atelier.audio.decodeFile = function (file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error(Atelier.t('err.read'))); };
      reader.onload = function () {

        ctx.decodeAudioData(reader.result,
          function (buf) { resolve(buf); },
          function () { reject(new Error(Atelier.t('err.decode'))); });
      };
      reader.readAsArrayBuffer(file);

  /** Synthesised demo sounds — the fallback when nobody has a file to hand. */
  Atelier.audio.generate = function (kind, opts) {
    opts = opts || {};
    var ctx = Atelier.audio.ctx();
    var sr = ctx.sampleRate;
    var dur = opts.duration || 3;
    var n = Math.floor(sr * dur);
    var buf = ctx.createBuffer(1, n, sr);
    var x = buf.getChannelData(0);
    var i, t;

    if (kind === 'sine') {
      var f = opts.frequency || 440;
      for (i = 0; i < n; i++) x[i] = 0.7 * Math.sin(2 * Math.PI * f * i / sr);

    } else if (kind === 'sweep') {
      var f0 = 80, f1 = 8000, phase = 0;
      for (i = 0; i < n; i++) {
        phase += 2 * Math.PI * (f0 * Math.pow(f1 / f0, i / n)) / sr;
        x[i] = 0.6 * Math.sin(phase);
      }

    } else if (kind === 'noise') {
      for (i = 0; i < n; i++) x[i] = 0.5 * (Math.random() * 2 - 1);

    } else if (kind === 'bell') {
      var carrier = 520, ratio = 1.41;
      for (i = 0; i < n; i++) {
        t = i / sr;
        x[i] = 0.7 * Math.exp(-t * 2.2) *
               Math.sin(2 * Math.PI * carrier * t +
                        7 * Math.exp(-t * 5) * Math.sin(2 * Math.PI * carrier * ratio * t));
      }

    } else if (kind === 'pluck') {
      var freq = opts.frequency || 196;
      var len = Math.round(sr / freq);
      var ring = new Float32Array(len);
      for (i = 0; i < len; i++) ring[i] = Math.random() * 2 - 1;
      var idx = 0;
      for (i = 0; i < n; i++) {
        var next = (idx + 1) % len;
        ring[idx] = 0.498 * (ring[idx] + ring[next]);
        x[i] = 0.8 * ring[idx] * Math.exp(-i / sr * 0.8);
        idx = next;
      }

    } else if (kind === 'texture') {
      var y1 = 0, y2 = 0;
      for (i = 0; i < n; i++) {
        t = i / sr;
        var cut = 0.02 + 0.35 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 0.25 * t));
        var w = Math.random() * 2 - 1;
        y1 += cut * (w - y1);
        y2 += cut * (y1 - y2);
        x[i] = 0.9 * (y1 - y2) * 6;
      }

    } else {
      throw new Error(Atelier.t('err.unknownDemo', { k: kind }));
    }

    var fade = Math.min(Math.floor(sr * 0.01), Math.floor(n / 2));
    for (i = 0; i < fade; i++) { x[i] *= i / fade; x[n - 1 - i] *= i / fade; }

    src.connect(Atelier.audio.master());
    src.onended = function () {
      if (currentSource === src) currentSource = null;
      if (onEnded) onEnded();

    currentSource = src;

  Atelier.dsp = {};

  Atelier.dsp.mono = function (buffer) {
    var n = buffer.length, ch = buffer.numberOfChannels;
    if (ch === 1) return buffer.getChannelData(0).slice();
    var out = new Float32Array(n);
    for (var c = 0; c < ch; c++) {
      var d = buffer.getChannelData(c);
      for (var i = 0; i < n; i++) out[i] += d[i] / ch;

      the argument stack somewhere above ~100k entries). */
  Atelier.dsp.extent = function (values) {
    var lo = Infinity, hi = -Infinity, seen = false;
    for (var i = 0; i < values.length; i++) {
      var v = values[i];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
      seen = true;
    }
    return seen ? { min: lo, max: hi } : null;

  /**
   * Run Meyda over a signal frame by frame, yielding to the browser so the page
   * stays responsive on long files (a one-hour recording is ~300 000 frames).
   *
   * returns Promise<{times, sampleRate, frameSize, hopSize, nFrames, features}>
   * spectralCentroid is converted from bins to hertz; loudness is reduced to its
   * total.
   */
  Atelier.dsp.describe = function (signal, sampleRate, features, opts) {
    opts = opts || {};
    var size = opts.frameSize || 1024;
    var hop = opts.hopSize || Math.floor(size / 2);
    var onProgress = opts.onProgress;

    if (!global.Meyda) return Promise.reject(new Error(Atelier.t('err.noMeyda')));
    if (!Atelier.dsp.isPowerOfTwo(size)) return Promise.reject(new Error(Atelier.t('err.pow2')));

    var M = global.Meyda;
    M.sampleRate = sampleRate;
    M.bufferSize = size;
    M.windowingFunction = 'hanning';

    var nFrames = Math.max(0, Math.floor((signal.length - size) / hop) + 1);
    var out = { times: new Float64Array(nFrames), sampleRate: sampleRate,
                frameSize: size, hopSize: hop, nFrames: nFrames, features: {} };
    // Typed arrays: a one-hour file at 1024/512 is 300k frames per feature.
    features.forEach(function (f) { out.features[f] = new Float64Array(nFrames); });

    var frame = new Float32Array(size);
    var i = 0;
    var CHUNK = 300;

    return new Promise(function (resolve, reject) {
      function step() {
        try {
          var end = Math.min(i + CHUNK, nFrames);
          for (; i < end; i++) {
            var off = i * hop;
            frame.set(signal.subarray(off, off + size));
            var f = M.extract(features, frame);
            out.times[i] = (off + size / 2) / sampleRate;
            for (var k = 0; k < features.length; k++) {
              var name = features[k];
              var v = f[name];
              if (name === 'spectralCentroid') v = v * sampleRate / size;
              else if (name === 'loudness') v = v ? v.total : NaN;
              out.features[name][i] = (typeof v === 'number') ? v : NaN;
            }
          }
          if (onProgress) onProgress(nFrames ? i / nFrames : 1);
          if (i < nFrames) setTimeout(step, 0);
          else resolve(out);
        } catch (err) { reject(err); }
      }
      step();
    });

  Atelier.dsp.envelope = function (signal, width) {
    var per = signal.length / width;
    var mins = new Float32Array(width), maxs = new Float32Array(width);
    for (var c = 0; c < width; c++) {
      var start = Math.floor(c * per), stop = Math.min(Math.floor((c + 1) * per), signal.length);
      if (stop <= start) stop = Math.min(start + 1, signal.length);
      var lo = Infinity, hi = -Infinity;
      for (var i = start; i < stop; i++) {
        var v = signal[i];
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
      mins[c] = isFinite(lo) ? lo : 0;
      maxs[c] = isFinite(hi) ? hi : 0;
    }
    return { mins: mins, maxs: maxs };
  };

    var f = Atelier.draw.fit(canvas, opts.height || 130);

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = css('--line');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    canvas._atGeom = { padL: 0, padT: 0, plotW: w, plotH: h };

    var env = Atelier.dsp.envelope(signal, Math.max(1, Math.floor(w)));
    ctx.strokeStyle = opts.color || css('--accent');
    ctx.beginPath();
    for (var c = 0; c < env.mins.length; c++) {

  /**
   * Plot one descriptor curve against time. Series longer than the canvas are
   * reduced to a per-pixel min/max band, so a 300 000-point series draws in one
   * pass and still shows its range.

  Atelier.draw.curve = function (canvas, times, values, opts) {
    opts = opts || {};
    var f = Atelier.draw.fit(canvas, opts.height || 130);
    var ctx = f.ctx, w = f.w, h = f.h;
    var padL = 3.6 * parseFloat(getComputedStyle(doc.documentElement).fontSize);
    var padB = 18, padT = 10;
    ctx.clearRect(0, 0, w, h);

    var ext = Atelier.dsp.extent(values);
    if (!ext) return;
    var lo = opts.min !== undefined ? opts.min : ext.min;
    var hi = opts.max !== undefined ? opts.max : ext.max;
    if (hi - lo < 1e-12) hi = lo + 1;

    var plotW = Math.max(10, w - padL - 8), plotH = Math.max(10, h - padT - padB);
    var n = values.length;
    // opts.tMax: the time at the right edge (default: the last frame's centre).
    var tMax = opts.tMax || (n ? times[n - 1] : 1);

    ctx.strokeStyle = css('--line-firm');
    ctx.fillStyle = css('--ink-soft');
    ctx.font = '11px ' + css('--mono');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(Atelier.fmt(hi), padL - 6, padT + 5);
    ctx.fillText(Atelier.fmt(lo), padL - 6, padT + plotH - 5);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('0 s', padL, h - 4);
    ctx.textAlign = 'right';
    ctx.fillText(tMax.toFixed(1) + ' s', padL + plotW, h - 4);
    if (opts.label) {
      ctx.textAlign = 'left';
      ctx.fillStyle = css('--ink');
      ctx.font = '12px ' + css('--sans');
      ctx.fillText(opts.label + (opts.unit ? ' (' + opts.unit + ')' : ''), padL + 6, padT + 11);
    }

    canvas._atGeom = { padL: padL, padT: padT, plotW: plotW, plotH: plotH };

    var y = function (v) { return padT + plotH - ((v - lo) / (hi - lo)) * plotH; };
    ctx.strokeStyle = opts.color || css('--accent');
    ctx.lineWidth = 1.4;
    ctx.beginPath();

    if (n > plotW * 1.5) {

      var cols = Math.floor(plotW);
      var per = n / cols;
      for (var c = 0; c < cols; c++) {
        var s = Math.floor(c * per), e = Math.min(Math.floor((c + 1) * per), n);

        var mn = Infinity, mx = -Infinity;
        for (var i = s; i < e; i++) {

      for (var j = 0; j < n; j++) {

        if (typeof val !== 'number' || !isFinite(val)) { started = false; continue; }
        var xx = padL + (tMax ? times[j] / tMax : 0) * plotW;
        if (!started) { ctx.moveTo(xx, y(val)); started = true; } else { ctx.lineTo(xx, y(val)); }

    if (a >= 10) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.001) return v.toFixed(4);

    var n = re.length, i, j, k, m, len, half, step, ang, wr, wi, cr, ci, tr, ti, tmp;
    for (i = 1, j = 0; i < n; i++) {

      for (i = 0; i < n; i += len) {

          cr = re[step] * wr - im[step] * wi;

          re[step] = re[m] - cr; im[step] = im[m] - ci;
          re[m] += cr; im[m] += ci;
          tr = wr * wlr - wi * wli; wi = wr * wli + wi * wlr; wr = tr;
        }

  /* === synthesis of the example sounds ====================================
     Seeded noise, so an example measures the same every time it is loaded. */

  var SR = 44100, SEG = 1.5;
  var seed = 1;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function rmsOf(x) { var s = 0; for (var i = 0; i < x.length; i++) s += x[i] * x[i]; return Math.sqrt(s / Math.max(1, x.length)); }
  function setRms(x, r) { var k = r / (rmsOf(x) || 1); for (var i = 0; i < x.length; i++) x[i] *= k; return x; }
  function dB(v) { return Math.pow(10, v / 20); }

  function sine(n, f, amp) { var x = new Float32Array(n); for (var i = 0; i < n; i++) x[i] = amp * Math.sin(2 * Math.PI * f * i / SR); return x; }
  function partials(n, list) {
    var x = new Float32Array(n);
    list.forEach(function (p) { for (var i = 0; i < n; i++) x[i] += p[1] * Math.sin(2 * Math.PI * p[0] * i / SR); });
    return x;
  }
  function harm(n, f0, nh, rms) {
    var list = [];
    for (var k = 1; k <= nh && f0 * k < SR / 2; k++) list.push([f0 * k, 1 / k]);
    return setRms(partials(n, list), rms);
  }
  function white(n, rms) { var x = new Float32Array(n); for (var i = 0; i < n; i++) x[i] = rnd() * 2 - 1; return setRms(x, rms); }
  function pink(n, rms) {   // Paul Kellet's filter on white noise
    var x = new Float32Array(n), b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (var i = 0; i < n; i++) {
      var w = rnd() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      x[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
    }
    return setRms(x, rms);

  function band(n, f0, f1, rms) {   // many random-phase sines 1 Hz apart: a brick-wall band
    var x = new Float32Array(n);
    for (var f = f0; f <= f1; f++) {

    else { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2; }
    var x1 = 0, x2 = 0, y1 = 0, y2 = 0, y = new Float32Array(x.length);

      var v = (b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }

  var DRONE_RMS = 0.3;
  function drone(n) { return harm(n, 80, 20, DRONE_RMS); }
  function hiss(n, rel) {           // 6–12 kHz, `rel` dB below the drone
    var x = white(n, 0.3);

    x = biquad(biquad(x, 'lp', 12000), 'lp', 12000);

  function sineHiss(n, rel) {

    for (var i = 0; i < n; i++) s[i] += h[i];

  function pluck(n, freq, amp) {    // Karplus–Strong, as in the toolkit, with seeded noise
    var len = Math.round(SR / freq), ring = new Float32Array(len), x = new Float32Array(n), idx = 0, i;
    for (i = 0; i < len; i++) ring[i] = rnd() * 2 - 1;

  /* One segment spec → Float32Array at SR. The last numeric argument of most

  function makeSegment(s) {

      case 'partials': n = N(a[2]); return fade(partials(n, a[0]));
      case 'harm': n = N(a[3]); return fade(harm(n, a[0], a[1], a[2]));
      case 'white': n = N(a[2]); return fade(white(n, a[0]));
      case 'pink': n = N(a[1]); return fade(pink(n, a[0]));
      case 'band': n = N(a[3]); return fade(band(n, a[0], a[1], a[2]));
      case 'drone': return fade(drone(N()));

      case 'vibrato': return fade(vibrato(N(a[0])));
      case 'notes': return notes(N(a[1]), a[0]);
      case 'pluck': return pluck(N(a[2]), a[0], a[1]);
      case 'silence': return new Float32Array(N());
    }
    throw new Error('segment ' + k);
  }

  /* Build an example: an AudioBuffer plus its segment boundaries. */
  function buildExample(ex) {
    seed = 12345;
    if (ex.segs.length === 1 && ex.segs[0][1] === 'demo') {
      var b = Atelier.audio.generate(ex.segs[0][2], { duration: ex.segs[0][3] || 3 });
      return { buffer: b, segs: [{ lab: '', t0: 0, t1: b.duration }] };
    }
    var parts = ex.segs.map(makeSegment), total = 0;
    parts.forEach(function (p) { total += p.length; });
    var buf = Atelier.audio.ctx().createBuffer(1, total, SR), d = buf.getChannelData(0);
    var off = 0, segs = [];
    parts.forEach(function (p, i) {
      d.set(p, off);
      segs.push({ lab: ex.segs[i][0], t0: off / SR, t1: (off + p.length) / SR });
      off += p.length;
    });
    return { buffer: buf, segs: segs };
  }

  function select(id, user) {
    var d = DESC.filter(function (x) { return x.id === id; })[0] || DESC[0];
    current = d;
    DESC.forEach(function (x) {

  function updateFrameHint() {
    var size = frameSize(), sr = buffer ? buffer.sampleRate : SR, hop = size / 2;
    var s = Atelier.t('frame.hint', { size: size, hop: hop, ms: fmt(size / sr * 1000), hz: fmt(sr / size) });

    // a semitone is f·(2^(1/12) − 1) ≈ 0.0595 f wide: below f = bin / 0.0595 two notes share a bin
    if (current.id === 'chroma') s += Atelier.t('frame.chroma', { f: String(Math.round(sr / size / 0.0595)) });

  /* === loading ============================================================= */

  function adopt(buf, name, segs, ref) {
    buffer = buf; srcName = name; segments = segs || []; exampleRef = ref || null;
    signal = Atelier.dsp.mono(buf);
    cache = {};
    tp.setBuffer(buf);
    tp.detachAll();
    drawWave();
    tp.attach($('wave'));
    updateCaption(); updateFrameHint();
    Atelier.log.ok(name + ' — ' + buf.duration.toFixed(2) + ' s, ' + buf.sampleRate + ' Hz');
    Array.prototype.forEach.call($('d-ex').children, function (li, i) {
      li.setAttribute('data-current', ref && ref.d === current && ref.i === i ? 'true' : 'false');
    });
    analyse();
  }

  function updateCaption() {
    $('wave-caption').textContent = buffer
      ? Atelier.t('caption.loaded', { name: srcName, dur: fmt(buffer.duration), sr: buffer.sampleRate, ch: buffer.numberOfChannels })
      : Atelier.t('caption.none');
  }

    try {
      // every example states its frame size: what it shows depends on it
      $('fftsize').value = String(d.ex[i].frame || 1024); updateFrameHint();
      var built = buildExample(d.ex[i]);
      adopt(built.buffer, Atelier.t('x.' + d.id + '.' + i + '.label'), built.segs, { d: d, i: i });
    } catch (err) {
      Atelier.status($('status'), Atelier.t('st.failed', { msg: err.message }), 'bad');
    }

  /* === analysis ============================================================ */

  function analyse() {
    if (!signal) return;
    var size = frameSize(), hop = size / 2, d = current, key = d.feat + ':' + size;
    if (signal.length < size) { Atelier.status($('status'), Atelier.t('st.tooshort'), 'bad'); return; }
    var my = ++token;
    if (cache[key]) { result = cache[key]; render(); return; }
    $('prog').hidden = false; $('prog').value = 0;
    Atelier.status($('status'), Atelier.t('st.running', { name: Atelier.t('d.' + d.id + '.name') }));
    Atelier.dsp.describe(signal, buffer.sampleRate, [d.feat], {
      frameSize: size, hopSize: hop,
      onProgress: function (p) { if (my === token) $('prog').value = p; }
    }).then(function (res) {
      if (d.feat === 'spectralSpread') {        // bins → Hz, to sit beside the centroid
        var v = res.features.spectralSpread, k = res.sampleRate / size;
        for (var i = 0; i < v.length; i++) v[i] *= k;
      }
      cache[key] = res;
      if (my !== token) return;
      result = res;
      $('prog').hidden = true;
      Atelier.status($('status'), Atelier.t('st.done', { name: Atelier.t('d.' + d.id + '.name'), n: res.nFrames.toLocaleString(lang()) }), 'ok');
      render();
    }).catch(function (err) {
      if (my !== token) return;
      $('prog').hidden = true;
      Atelier.status($('status'), Atelier.t('st.failed', { msg: err.message }), 'bad');
    });

  /* --- statistics ---------------------------------------------------------- */

  function median(arr) {
    var a = [], n = 0;
    for (var i = 0; i < arr.length; i++) if (isFinite(arr[i])) a.push(arr[i]);
    if (!a.length) return { med: NaN, nan: 1 };
    a.sort(function (x, y) { return x - y; });
    return { med: a[a.length >> 1], nan: 1 - a.length / arr.length };

  function framesIn(seg) {            // frames lying wholly inside a segment

    for (var i = 0; i < result.nFrames; i++) {
      var t = result.times[i];
      if (t - half >= seg.t0 - 1e-9 && t + half <= seg.t1 + 1e-9) out.push(i);
    }
    return out;
  }
  function seriesFor(idx) { var v = scalarSeries(); return idx.map(function (i) { return v[i]; }); }
  function scalarSeries() { return result.features[current.feat]; }
  function matrixRowMedians(m, idx, from) {
    var out = [];
    for (var r = from; r < m.rows; r++) out.push(median(idx.map(function (i) { return m.data[r * m.cols + i]; })).med);
    return out;
  }

  function segmentReport() {
    if (!segments.length || !exampleRef || exampleRef.d !== current) return '';
    var parts = [], d = current;
    if (d.id === 'mfcc') {
      var m = result.matrices.mfcc, prof = [];
      segments.forEach(function (s) {
        var idx = framesIn(s), med = matrixRowMedians(m, idx, 0);
        prof.push(med.slice(1));
        parts.push(s.lab + '  c0 ' + fmt(med[0]) + ' · c1 ' + fmt(med[1]));
      });
      var dist = [];
      for (var a = 0; a < segments.length; a++) for (var b = a + 1; b < segments.length; b++) {
        var s2 = 0; for (var k = 0; k < prof[a].length; k++) s2 += Math.pow(prof[a][k] - prof[b][k], 2);
        dist.push(segments[a].lab + '–' + segments[b].lab + ' ' + fmt(Math.sqrt(s2)));
      }
      return parts.join('   |   ') + '\n' + Atelier.t('mfcc.dist') + ' : '.replace(' :', lang() === 'fr' ? ' :' : ':') + dist.join(' · ');
    }
    if (d.id === 'chroma') {
      var names = pcNames(), c = result.matrices.chroma;
      segments.forEach(function (s) {
        var med = matrixRowMedians(c, framesIn(s), 0), lit = [];
        med.forEach(function (v, k) { if (v >= 0.5) lit.push({ k: k, v: v }); });
        lit.sort(function (x, y) { return y.v - x.v; });
        parts.push(s.lab + '  ' + (lit.length ? lit.map(function (o) { return names[o.k] + ' ' + fmt(o.v); }).join(', ')
                                               : Atelier.t('seg.none')));
      });
      return parts.join('   |   ');
    }
    segments.forEach(function (s) {
      var vals = seriesFor(framesIn(s)), st = median(vals);
      var txt = isFinite(st.med) ? fmt(st.med) + (unit() ? ' ' + unit() : '') : Atelier.t('seg.none');
      if (d.id === 'flux' && isFinite(st.med)) txt = Atelier.t('seg.medmax', { med: fmt(st.med), max: fmt(Atelier.dsp.extent(vals).max) });
      if (isFinite(st.med) && st.nan > 0.2) txt += ' (' + Atelier.t('seg.nan', { p: Math.round(st.nan * 100) }) + ')';
      parts.push(s.lab + '  ' + txt);
    });
    return parts.join('   |   ');
  }

  /* === drawing ============================================================= */

  function cssv(n) { return getComputedStyle(document.body).getPropertyValue(n).trim(); }

  function drawWave() {
    if (!signal) return;
    Atelier.draw.waveform($('wave'), signal, { label: srcName, height: 90 });
    markSegments($('wave'));
  }

  /* Dashed boundaries and A/B/C labels, on the transport's time mapping so
     they line up with the playhead. */
  function markSegments(cv) {
    if (!segments.length || !buffer) return;
    var g = cv._atGeom; if (!g) return;
    var ctx = cv.getContext('2d'), dur = buffer.duration;
    ctx.save();
    ctx.strokeStyle = cssv('--warn'); ctx.fillStyle = cssv('--warn');
    ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.font = '600 12px ' + cssv('--sans'); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    segments.forEach(function (s, i) {
      var x = g.padL + s.t0 / dur * g.plotW;
      if (i > 0) { ctx.beginPath(); ctx.moveTo(x + 0.5, g.padT); ctx.lineTo(x + 0.5, g.padT + g.plotH); ctx.stroke(); }
      if (s.lab) ctx.fillText(s.lab, x + 4, g.padT + (cv.id === 'wave' ? 3 : 16));
    });
    ctx.restore();
  }

  function drawEmpty() {
    var f = Atelier.draw.fit($('curve'), 60);
    f.ctx.clearRect(0, 0, f.w, f.h);
    $('stats').textContent = '';
    updateCaption();
    drawLoupe();
  }

  function render() {
    if (!result) return;
    var d = current, cv = $('curve'), tEnd = buffer.duration;
    if (d.id === 'mfcc') {
      var m = result.matrices.mfcc, rows = m.rows - 1, yl = [];
      for (var k = 1; k <= rows; k += 2) yl.push({ row: k - 0.5, text: 'c' + k });
      Atelier.draw.heat(cv, { rows: rows, cols: m.cols, data: m.data.subarray(m.cols) },
                        { height: 190, label: Atelier.t('d.mfcc.name'), x1: fmt(tEnd) + ' s', yLabels: yl });
    } else if (d.id === 'chroma') {
      var c = result.matrices.chroma, names = pcNames(), yl2 = [];
      for (var r = 0; r < 12; r++) yl2.push({ row: r + 0.5, text: names[r] });
      Atelier.draw.heat(cv, c, { height: 220, min: 0, max: 1, label: Atelier.t('d.chroma.name'),
                                 x1: fmt(tEnd) + ' s', yLabels: yl2 });
    } else {
      Atelier.draw.curve(cv, result.times, scalarSeries(), {
        label: Atelier.t('d.' + d.id + '.name'), unit: unit(), height: 160,
        tMax: tEnd       // span the whole sound, as the playhead and segment marks do
      });
    }
    markSegments(cv);
    tp.detachAll();
    tp.attach($('wave'));
    tp.attach(cv);
    tp.refresh();

    // whole-sound statistics
    if (d.matrix) $('stats').textContent = '';
    else {
      var st = median(scalarSeries()), ext = Atelier.dsp.extent(scalarSeries());
      if (!ext) $('stats').textContent = Atelier.t('stats.none');
      else {
        var u = unit() ? ' ' + unit() : '';
        $('stats').textContent = Atelier.t('stats', { med: fmt(st.med) + u, min: fmt(ext.min) + u, max: fmt(ext.max) + u }) +
          (st.nan > 0.005 ? Atelier.t('stats.nan', { p: Math.round(st.nan * 100) }) : '');
      }
    }
    if (exampleRef && exampleRef.d === d) {
      var el = $('meas-' + exampleRef.i);
      if (el) { el.style.whiteSpace = 'pre-wrap'; el.textContent = segmentReport(); }
    }
    drawLoupe();
  }

  /* === the magnifier ======================================================= */

  function frameIndexAt(t) {
    if (!result) return -1;
    var i = Math.round((t * result.sampleRate - result.frameSize / 2) / result.hopSize);
    return Math.max(0, Math.min(result.nFrames - 1, i));
  }
  function frameAt(i) {
    var size = result.frameSize, off = i * result.hopSize, f = new Float32Array(size);
    f.set(signal.subarray(off, off + size));
    return f;
  }
  function meyda(feats, frame) {
    var M = window.Meyda;
    M.sampleRate = result.sampleRate; M.bufferSize = result.frameSize; M.windowingFunction = 'hanning';
    M.numberOfMFCCCoefficients = 13;
    if (feats.indexOf('chroma') >= 0) {
      // see toolkit.js: Meyda keeps a stale chroma filter bank across frame sizes
      if (M._gdChromaKey !== result.frameSize + ':' + result.sampleRate) {
        M.chromaFilterBank = undefined; M._gdChromaKey = result.frameSize + ':' + result.sampleRate;
      }
    }
    return M.extract(feats, frame);
  }

  function legend(items) {
    var box = $('loupe-legend'); box.innerHTML = '';
    items.forEach(function (it) {
      var s = document.createElement('span');
      s.style.setProperty('--sw', cssv(it[0]));
      s.textContent = Atelier.t(it[1]);
      box.appendChild(s);
    });
  }

  function valueText(i) {
    var d = current;
    if (d.id === 'mfcc' || d.id === 'chroma') return Atelier.t('d.' + d.id + '.short');
    var v = scalarSeries()[i];
    return Atelier.t('d.' + d.id + '.short') + ' = ' + (isFinite(v) ? fmt(v) + (unit() ? ' ' + unit() : '') : '—');
  }

  function drawLoupe() {
    var cv = $('loupe');
    if (!result || !signal) {
      var f0 = Atelier.draw.fit(cv, 60); f0.ctx.clearRect(0, 0, f0.w, f0.h);
      $('loupe-read').textContent = Atelier.t('loupe.empty');
      $('loupe-legend').innerHTML = '';
      return;
    }
    var i = frameIndexAt(tp.time()), frame = frameAt(i);
    $('loupe-read').textContent = Atelier.t('loupe.read', { i: i, t: fmt(result.times[i]), v: valueText(i) });
    var L = current.loupe;
    if (L === 'rms' || L === 'zcr' || L === 'pitch') loupeWave(cv, frame, i, L);
    else if (L === 'bark') loupeBars(cv, meyda(['loudness'], frame).loudness.specific, { lg: 'lg.bark', zero: true });
    else if (L === 'mfcc') loupeBars(cv, meyda(['mfcc'], frame).mfcc, { lg: 'mfcc', signed: true, labels: 'c' });
    else if (L === 'chroma') loupeBars(cv, meyda(['chroma'], frame).chroma, { lg: 'lg.chroma', zero: true, max: 1, labels: 'pc' });
    else loupeSpectrum(cv, frame, i, L);
  }

  function loupeWave(cv, frame, idx, mode) {
    var f = Atelier.draw.fit(cv, 170), ctx = f.ctx, w = f.w, h = f.h, n = frame.length;
    var win = Atelier.dsp.window(n, 'hann'), mid = h / 2, peak = 1e-9, i;
    for (i = 0; i < n; i++) peak = Math.max(peak, Math.abs(frame[i]));
    var sc = (h / 2 - 8) / peak;
    var X = function (k) { return 6 + k / (n - 1) * (w - 12); };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = cssv('--line'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid + 0.5); ctx.lineTo(w, mid + 0.5); ctx.stroke();
    function path(get, col, lw) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
      for (var k = 0; k < n; k++) { var y = mid - get(k) * sc; if (k) ctx.lineTo(X(k), y); else ctx.moveTo(X(k), y); }
      ctx.stroke();
    }
    if (mode === 'rms') {
      path(function (k) { return frame[k]; }, cssv('--line-firm'), 1);
      path(function (k) { return frame[k] * win[k]; }, cssv('--accent'), 1.4);
      var r = scalarSeries()[idx];
      if (isFinite(r)) {
        ctx.strokeStyle = cssv('--warn'); ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
        [r, -r].forEach(function (v) { ctx.beginPath(); ctx.moveTo(0, mid - v * sc); ctx.lineTo(w, mid - v * sc); ctx.stroke(); });
        ctx.setLineDash([]);
      }
      legend([['--line-firm', 'lg.raw'], ['--accent', 'lg.win'], ['--warn', 'lg.rms']]);
    } else if (mode === 'zcr') {
      path(function (k) { return frame[k] * win[k]; }, cssv('--accent'), 1.2);
      ctx.fillStyle = cssv('--warn');
      for (i = 1; i < n; i++) {
        var a = frame[i - 1] * win[i - 1], b = frame[i] * win[i];
        if ((a >= 0 && b < 0) || (a < 0 && b >= 0)) { ctx.beginPath(); ctx.arc(X(i), mid, 2.4, 0, 2 * Math.PI); ctx.fill(); }
      }
      legend([['--accent', 'lg.win'], ['--warn', 'lg.cross']]);
    } else {
      path(function (k) { return frame[k]; }, cssv('--accent'), 1.2);
      var p = scalarSeries()[idx];
      if (isFinite(p)) {
        var per = result.sampleRate / p;
        ctx.strokeStyle = cssv('--warn'); ctx.lineWidth = 1.5;
        // the first few periods only: at 2 kHz a frame holds ~45 of them
        for (var t = 0, c = 0; t < n && c <= 6; t += per, c++) { ctx.beginPath(); ctx.moveTo(X(t), 6); ctx.lineTo(X(t), h - 6); ctx.stroke(); }
        legend([['--accent', 'lg.raw'], ['--warn', 'lg.period']]);
      } else legend([['--accent', 'lg.raw'], ['--bad', 'lg.nopitch']]);
    }
    cv.setAttribute('aria-label', $('loupe-read').textContent);
  }

  function loupeBars(cv, vals, o) {
    var f = Atelier.draw.fit(cv, 170), ctx = f.ctx, w = f.w, h = f.h;
    ctx.clearRect(0, 0, w, h);
    vals = vals ? Array.prototype.slice.call(vals) : [];
    var n = vals.length; if (!n) return;
    var lo = 0, hi = o.max || 0, i;
    for (i = 0; i < n; i++) { if (isFinite(vals[i])) { hi = Math.max(hi, vals[i]); if (o.signed) lo = Math.min(lo, vals[i]); } }
    if (o.signed) { var m = Math.max(Math.abs(lo), Math.abs(hi), 1e-9); lo = -m; hi = m; }
    if (hi - lo < 1e-12) hi = lo + 1;
    var padB = 18, padT = 8, plotH = h - padB - padT, bw = (w - 12) / n;
    var Y = function (v) { return padT + (hi - v) / (hi - lo) * plotH; };
    var names = o.labels === 'pc' ? pcNames() : null;
    ctx.font = '11px ' + cssv('--mono'); ctx.textAlign = 'center';
    for (i = 0; i < n; i++) {
      var v = isFinite(vals[i]) ? vals[i] : 0, x = 6 + i * bw;
      ctx.fillStyle = (o.signed && i === 0) ? cssv('--line-firm') : cssv('--accent');
      var y0 = Y(0), y1 = Y(v);
      ctx.fillRect(x + bw * 0.12, Math.min(y0, y1), bw * 0.76, Math.max(1, Math.abs(y1 - y0)));
      ctx.fillStyle = cssv('--ink-soft');
      var lab = names ? names[i] : (o.labels === 'c' ? 'c' + i : String(i + 1));
      if (n <= 13 || i % 2 === 0) ctx.fillText(lab, x + bw / 2, h - 4);
    }
    ctx.strokeStyle = cssv('--line-firm'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(6, Y(0) + 0.5); ctx.lineTo(w - 6, Y(0) + 0.5); ctx.stroke();
    if (o.lg === 'mfcc') legend([['--line-firm', 'lg.mfcc0'], ['--accent', 'lg.mfcc']]);
    else legend([['--accent', o.lg]]);
    cv.setAttribute('aria-label', $('loupe-read').textContent);
  }

  function loupeSpectrum(cv, frame, idx, mode) {
    var f = Atelier.draw.fit(cv, 200), ctx = f.ctx, w = f.w, h = f.h;
    var sr = result.sampleRate, size = result.frameSize, binHz = sr / size, nyq = sr / 2;
    var fx = meyda(['amplitudeSpectrum', 'spectralCentroid', 'spectralSpread', 'spectralRolloff'], frame);
    var amp = fx.amplitudeSpectrum, n = amp.length, i;
    var padL = 44, padR = 10, padT = 8, padB = 20, plotW = w - padL - padR, plotH = h - padT - padB;
    var logf = $('logf').checked, fMin = 20;
    var X = function (hz) {
      if (!logf) return padL + Math.min(1, hz / nyq) * plotW;
      return padL + Math.max(0, Math.log(Math.max(hz, fMin) / fMin) / Math.log(nyq / fMin)) * plotW;
    };
    var peak = 1e-12;
    for (i = 0; i < n; i++) peak = Math.max(peak, amp[i]);
    var silent = peak < 1e-9;
    var FLOOR = -100;
    var dbOf = function (v, ref) { return Math.max(FLOOR, 20 * Math.log10(Math.max(v, 1e-12) / ref)); };
    var Y = function (db) { return padT + (-db / -FLOOR) * plotH; };
    ctx.clearRect(0, 0, w, h);
    // axes
    ctx.strokeStyle = cssv('--line-firm'); ctx.lineWidth = 1;
    ctx.strokeRect(padL + 0.5, padT + 0.5, plotW, plotH);
    ctx.fillStyle = cssv('--ink-soft'); ctx.font = '11px ' + cssv('--mono');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    [0, -40, -80].forEach(function (db) { ctx.fillText(db + ' dB', padL - 4, Y(db)); });
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    (logf ? [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000] : [0, 2000, 5000, 10000, 15000, 20000]).forEach(function (hz) {
      if (hz > nyq) return;
      ctx.fillText(hz >= 1000 ? (hz / 1000) + 'k' : String(hz), X(hz), h - 5);
    });
    if (silent) {
      ctx.textAlign = 'center'; ctx.fillText(Atelier.t('lg.silent'), padL + plotW / 2, padT + plotH / 2);
      legend([['--accent', 'lg.spec']]);
      cv.setAttribute('aria-label', $('loupe-read').textContent);
      return;
    }
    function spectrumPath(a, ref, col, lw) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
      for (var k = 1; k < a.length; k++) {
        var x = X(k * binHz), y = Y(dbOf(a[k], ref));
        if (k === 1) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    var items = [];
    if (mode === 'flux') {
      // same spectra as the flux computation: Atelier.dsp.magnitude, Hann window
      var win = Atelier.dsp.window(size, 'hann');
      var cur = Atelier.dsp.magnitude(frame, win), prev = idx > 0 ? Atelier.dsp.magnitude(frameAt(idx - 1), win) : null;
      var ref = 1e-12;
      for (i = 0; i < cur.length; i++) { ref = Math.max(ref, cur[i]); if (prev) ref = Math.max(ref, prev[i]); }
      if (prev) {
        ctx.fillStyle = cssv('--warn');
        for (i = 1; i < cur.length; i++) {
          if (cur[i] <= prev[i]) continue;
          var x0 = X((i - 0.5) * binHz), x1 = X((i + 0.5) * binHz);
          var ya = Y(dbOf(cur[i], ref)), yb = Y(dbOf(prev[i], ref));
          ctx.fillRect(x0, ya, Math.max(1, x1 - x0), Math.max(1, yb - ya));
        }
        spectrumPath(prev, ref, cssv('--line-firm'), 1);
      }
      spectrumPath(cur, ref, cssv('--accent'), 1.3);
      items = [['--line-firm', 'lg.prev'], ['--accent', 'lg.cur'], ['--warn', 'lg.up']];
    } else {
      spectrumPath(amp, peak, cssv('--accent'), 1.3);
      items = [['--accent', 'lg.spec']];
      var cHz = fx.spectralCentroid * binHz, sHz = fx.spectralSpread * binHz;
      if (mode === 'spread' && isFinite(sHz)) {
        ctx.fillStyle = cssv('--accent-bg'); ctx.globalAlpha = 0.75;
        var a0 = X(Math.max(0, cHz - sHz)), a1 = X(Math.min(nyq, cHz + sHz));
        ctx.fillRect(a0, padT + 1, Math.max(1, a1 - a0), plotH - 1);
        ctx.globalAlpha = 1;
        spectrumPath(amp, peak, cssv('--accent'), 1.3);
        items.push(['--ok', 'lg.spread']);
        ctx.strokeStyle = cssv('--ok'); ctx.lineWidth = 2;
        [a0, a1].forEach(function (x) { ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke(); });
      }
      if ((mode === 'centroid' || mode === 'spread') && isFinite(cHz)) {
        ctx.strokeStyle = cssv('--warn'); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(X(cHz), padT); ctx.lineTo(X(cHz), padT + plotH); ctx.stroke();
        items.push(['--warn', 'lg.centroid']);
      }
      if (mode === 'rolloff') {
        var tot = 0; for (i = 0; i < n; i++) tot += amp[i];
        ctx.strokeStyle = cssv('--ok'); ctx.lineWidth = 1.6; ctx.beginPath();
        var acc = 0;
        for (i = 0; i < n; i++) {
          acc += amp[i];
          var yy = padT + (1 - acc / tot) * plotH;
          if (i) ctx.lineTo(X(i * binHz), yy); else ctx.moveTo(X(Math.max(fMin, 0)), yy);
        }
        ctx.stroke();
        var y99 = padT + 0.01 * plotH;
        ctx.setLineDash([3, 3]); ctx.strokeStyle = cssv('--ok'); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(padL, y99); ctx.lineTo(padL + plotW, y99); ctx.stroke(); ctx.setLineDash([]);
        if (isFinite(fx.spectralRolloff)) {
          ctx.strokeStyle = cssv('--warn'); ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(X(fx.spectralRolloff), padT); ctx.lineTo(X(fx.spectralRolloff), padT + plotH); ctx.stroke();
        }
        items.push(['--ok', 'lg.cum'], ['--warn', 'lg.rolloff']);
      }
      if (mode === 'flatness') {
        var sl = 0, sa = 0;
        for (i = 0; i < n; i++) { sl += Math.log(Math.max(amp[i], 1e-30)); sa += amp[i]; }
        var gm = Math.exp(sl / n), am = sa / n;
        ctx.lineWidth = 2;
        [[gm, '--ok'], [am, '--warn']].forEach(function (p) {
          ctx.strokeStyle = cssv(p[1]); ctx.beginPath();
          var y = Y(dbOf(p[0], peak)); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
        });
        items.push(['--ok', 'lg.gm'], ['--warn', 'lg.am']);
      }
    }
    legend(items);
    cv.setAttribute('aria-label', $('loupe-read').textContent);
  }

  /* follow the playhead while playing, and on every seek */
  var lastFrame = -1;
  (function follow() {
    if (result && tp.playing()) {
      var i = frameIndexAt(tp.time());
      if (i !== lastFrame) { lastFrame = i; drawLoupe(); }
    }
    requestAnimationFrame(follow);
  })();
  tp.onSeek(function () { lastFrame = -1; drawLoupe(); });
  $('logf').addEventListener('change', drawLoupe);

  /* === init ================================================================ */

  Atelier.init();

  function redraw() {
    renderPanel(); updateFrameHint(); updateCaption();
    drawWave();
    if (result) render(); else drawEmpty();
    tp.refresh();
  }
  Atelier.onRedraw(redraw);
  Atelier.onLanguageChange(function () { redraw(); });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(redraw, 180); });

  var start = (location.hash || '').replace('#', '');
  if (!start) { try { start = localStorage.getItem('gd.tab') || ''; } catch (e) { start = ''; } }
  select(start || 'rms', false);

  // test hook for the headless probe; harmless in class
  window.__gd = { DESC: DESC, select: select, loadExample: loadExample,
                  report: function () { return result ? segmentReport() : ''; },
                  result: function () { return result; },
                  setFrame: function (s) { $('fftsize').value = String(s); updateFrameHint(); if (signal) analyse(); } };
})();
</script>
</body>
</html>
